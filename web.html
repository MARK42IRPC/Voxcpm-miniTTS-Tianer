<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoxCPM 本地推理</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f4f6f7;
      --surface: #ffffff;
      --surface-muted: #eef1f2;
      --ink: #171a1c;
      --muted: #657078;
      --line: #d9dfe2;
      --line-strong: #aeb8bd;
      --green: #147a55;
      --green-hover: #0f6848;
      --teal: #147684;
      --red: #b43b3b;
      --shadow: 0 12px 30px rgba(25, 35, 40, 0.08);
    }

    * { box-sizing: border-box; }
    html { overflow-x: hidden; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button, input, select, textarea { min-width: 0; max-width: 100%; font: inherit; letter-spacing: 0; }
    button, label, select, input[type="range"] { cursor: pointer; }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand img { width: 34px; height: 34px; object-fit: contain; }
    .brand strong { font-size: 17px; white-space: nowrap; }
    .top-actions { display: flex; align-items: center; gap: 16px; }
    .nav { display: flex; align-items: center; gap: 4px; padding: 3px; background: var(--surface-muted); border-radius: 6px; }
    .nav a { padding: 7px 12px; border-radius: 4px; color: var(--muted); font-size: 13px; text-decoration: none; }
    .nav a.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(20, 28, 32, 0.12); }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa3a8; }
    .status-dot.ready { background: var(--green); }
    .status-dot.error { background: var(--red); }

    main { width: 100%; max-width: 1540px; margin: 0 auto; padding: 24px; }

    .app-layout {
      width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      align-items: start;
      gap: 20px;
    }

    .content-stack, form, .field, .mode-tabs, .device-group, .parameter-grid { width: 100%; min-width: 0; }

    .workspace {
      width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.75fr);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .composer, .settings { min-width: 0; padding: 24px; }
    .settings { background: #fafbfb; border-left: 1px solid var(--line); }
    .section + .section { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line); }
    .section-title { margin: 0 0 14px; font-size: 14px; font-weight: 700; }

    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 3px;
      margin-bottom: 18px;
      background: var(--surface-muted);
      border-radius: 6px;
    }

    .mode-tabs input { position: absolute; opacity: 0; pointer-events: none; }
    .mode-tabs label { min-width: 0; padding: 9px 4px; border-radius: 4px; text-align: center; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .mode-tabs input:checked + label { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(20, 28, 32, 0.12); }
    .mode-tabs input:disabled + label { cursor: not-allowed; opacity: 0.42; }

    .text-mode-tabs {
      display: grid;
      grid-template-columns: repeat(2, 76px);
      padding: 3px;
      background: var(--surface-muted);
      border-radius: 6px;
    }

    .text-mode-tabs input { position: absolute; opacity: 0; pointer-events: none; }
    .text-mode-tabs label { padding: 6px 8px; border-radius: 4px; color: var(--muted); font-size: 12px; text-align: center; }
    .text-mode-tabs input:checked + label { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(20, 28, 32, 0.12); }
    .segment-count { min-height: 16px; color: var(--muted); font-size: 12px; text-align: right; }
    .split-settings { display: grid; grid-template-columns: minmax(0, 1fr) 150px; align-items: end; gap: 12px; padding-top: 4px; }
    .split-mode-group, .split-value-control { display: grid; gap: 7px; min-width: 0; }
    .split-mode-group > label, .split-value-control > label { font-size: 12px; font-weight: 650; }
    .split-mode-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; background: var(--surface-muted); border-radius: 6px; }
    .split-mode-tabs input { position: absolute; opacity: 0; pointer-events: none; }
    .split-mode-tabs label { min-width: 0; padding: 7px 5px; border-radius: 4px; color: var(--muted); font-size: 12px; text-align: center; white-space: nowrap; }
    .split-mode-tabs input:checked + label { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(20, 28, 32, 0.12); }
    .batch-export-panel { margin: -4px 0 16px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .batch-export-panel .field { margin-bottom: 10px; }
    .batch-output-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 40px; gap: 8px; }
    .batch-export-status { min-height: 15px; margin-top: 7px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .batch-export-status.error { color: var(--red); }
    .batch-export-panel > .toggle-row + .toggle-row { margin-top: 10px; }

    .field { display: grid; gap: 8px; margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .field-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .select-action-row { display: grid; grid-template-columns: minmax(0, 1fr) repeat(2, 40px); gap: 8px; }
    .icon-button {
      width: 40px;
      height: 40px;
      display: inline-grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--surface);
      color: var(--teal);
      font-size: 20px;
      line-height: 1;
    }
    .icon-button:hover { border-color: var(--teal); background: #eef8f9; }
    .icon-button:disabled { cursor: wait; opacity: 0.58; }
    .icon-button span { display: inline-block; }
    .icon-button.loading span { animation: refresh-spin 700ms linear infinite; }
    @keyframes refresh-spin { to { transform: rotate(360deg); } }
    .field label, .field-row label { font-size: 13px; font-weight: 650; }
    .value { color: var(--teal); font-size: 12px; font-variant-numeric: tabular-nums; }

    .tooltip-trigger {
      position: relative;
      display: inline-flex;
      width: max-content;
      max-width: 100%;
      align-items: center;
      gap: 5px;
      outline: 0;
    }

    .tooltip-trigger::after {
      content: "?";
      display: inline-grid;
      place-items: center;
      flex: 0 0 16px;
      width: 16px;
      height: 16px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .tooltip-trigger:hover::after, .tooltip-trigger:focus-visible::after {
      border-color: var(--teal);
      color: var(--teal);
    }

    .tooltip-trigger:focus-visible {
      border-radius: 3px;
      box-shadow: 0 0 0 2px rgba(20, 118, 132, 0.18);
    }

    .property-tooltip {
      position: fixed;
      z-index: 1000;
      width: max-content;
      max-width: min(320px, calc(100vw - 24px));
      padding: 8px 10px;
      border: 1px solid #3e484d;
      border-radius: 5px;
      background: #20272a;
      color: #fff;
      box-shadow: 0 8px 20px rgba(20, 28, 32, 0.18);
      font-size: 12px;
      line-height: 1.55;
      letter-spacing: 0;
      pointer-events: none;
      opacity: 0;
      transform: translateY(2px);
      transition: opacity 100ms, transform 100ms;
    }

    .property-tooltip.visible { opacity: 1; transform: translateY(0); }

    textarea, select, input[type="number"], input[type="text"] {
      width: 100%;
      border: 1px solid #c9d0d4;
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
      transition: border-color 120ms, box-shadow 120ms;
    }

    textarea:focus, select:focus, input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(20, 118, 132, 0.12);
    }

    textarea { min-height: 164px; resize: vertical; padding: 12px; line-height: 1.6; }
    select, input[type="number"], input[type="text"] { height: 40px; padding: 0 11px; }
    textarea:disabled, select:disabled, input:disabled { cursor: not-allowed; opacity: 0.58; }
    input[type="range"] { width: 100%; accent-color: var(--green); }

    .dropzone {
      display: grid;
      place-items: center;
      min-height: 116px;
      padding: 16px;
      border: 1px dashed #aeb8bd;
      border-radius: 6px;
      background: #fafcfc;
      color: var(--muted);
      text-align: center;
    }

    .dropzone.active { border-color: var(--teal); background: #f1f8f9; }
    .dropzone input { display: none; }
    .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      height: 36px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }
    .dropzone:hover .file-button { border-color: var(--teal); color: var(--teal); }
    .file-name { margin-top: 8px; color: var(--ink); font-size: 12px; overflow-wrap: anywhere; }
    .reference-preview { width: 100%; height: 40px; margin-top: 8px; }

    .device-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .device-group input { position: absolute; opacity: 0; }
    .device-group label {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--muted);
    }
    .device-group input:checked + label { border-color: var(--teal); color: var(--teal); background: #eef8f9; }
    .device-group input:disabled + label { cursor: not-allowed; opacity: 0.42; }

    .mode-tabs .tooltip-trigger, .text-mode-tabs .tooltip-trigger, .device-group .tooltip-trigger {
      display: flex;
      width: auto;
      max-width: none;
      justify-content: center;
    }

    .mode-tabs .tooltip-trigger::after, .text-mode-tabs .tooltip-trigger::after, .device-group .tooltip-trigger::after {
      flex-basis: 14px;
      width: 14px;
      height: 14px;
      font-size: 9px;
    }

    .toggles { display: grid; gap: 12px; }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 13px; }
    .switch { position: relative; width: 42px; height: 24px; flex: 0 0 auto; }
    .switch input { position: absolute; opacity: 0; }
    .switch span { position: absolute; inset: 0; border-radius: 12px; background: #bdc5c9; transition: background 120ms; }
    .switch span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: transform 120ms; }
    .switch input:checked + span { background: var(--green); }
    .switch input:checked + span::after { transform: translateX(18px); }

    .parameter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .actionbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 20px;
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .action-feedback { min-width: 0; flex: 1 1 auto; display: grid; gap: 8px; }
    .message { min-width: 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .message.error { color: var(--red); }
    .inference-progress { display: grid; grid-template-columns: minmax(120px, 1fr) auto; align-items: center; gap: 10px; }
    .inference-progress progress { width: 100%; height: 8px; border: 0; border-radius: 4px; accent-color: var(--green); overflow: hidden; }
    .inference-progress span { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .action-buttons { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }

    .primary {
      min-width: 142px;
      height: 42px;
      border: 0;
      border-radius: 6px;
      background: var(--green);
      color: #fff;
      font-weight: 700;
    }
    .primary:hover { background: var(--green-hover); }
    .primary:disabled { cursor: wait; opacity: 0.62; }
    .stop-button { min-width: 88px; height: 42px; border: 1px solid #d8a6a6; border-radius: 6px; background: var(--surface); color: var(--red); font-weight: 700; }
    .stop-button:hover:not(:disabled) { border-color: var(--red); background: #fff4f4; }
    .stop-button:disabled { cursor: default; opacity: 0.42; }

    .output {
      display: none;
      margin-top: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .output.visible { display: block; }
    .output audio { width: 100%; height: 40px; }
    .download { color: var(--teal); font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; }
    .audio-comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 18px; }
    .audio-version { min-width: 0; }
    .audio-version-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .audio-version-head strong { font-size: 12px; }
    .audio-version-state { color: var(--muted); font-size: 11px; }
    .postprocess-panel { padding: 18px; border-top: 1px solid var(--line); background: var(--surface-muted); }
    .postprocess-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .postprocess-title { margin: 0; font-size: 14px; }
    .postprocess-preset { width: min(240px, 45%); }
    .postprocess-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .postprocess-grid .field label { font-size: 11px; }
    .postprocess-field-head { display: flex; min-height: 18px; align-items: center; justify-content: space-between; gap: 7px; }
    .mini-switch { position: relative; flex: 0 0 28px; width: 28px; height: 16px; }
    .mini-switch input { position: absolute; opacity: 0; pointer-events: none; }
    .mini-switch span { position: absolute; inset: 0; border-radius: 8px; background: #bdc5c9; transition: background 120ms; }
    .mini-switch span::after { content: ""; position: absolute; width: 12px; height: 12px; left: 2px; top: 2px; border-radius: 50%; background: #fff; transition: transform 120ms; }
    .mini-switch input:checked + span { background: var(--green); }
    .mini-switch input:checked + span::after { transform: translateX(12px); }
    .mini-switch:focus-within { border-radius: 8px; box-shadow: 0 0 0 2px rgba(20, 118, 132, 0.18); }
    .postprocess-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 16px; }
    .postprocess-message { min-width: 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .postprocess-button { min-width: 136px; height: 38px; border: 0; border-radius: 6px; background: var(--teal); color: #fff; font-weight: 700; }
    .postprocess-button:disabled { cursor: wait; opacity: 0.55; }

    .session-panel {
      position: sticky;
      top: 20px;
      max-height: calc(100vh - 40px);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .session-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line); }
    .session-title { margin: 0; font-size: 14px; }
    .session-count { color: var(--muted); font-size: 12px; font-weight: 400; }
    .clear-button { border: 0; background: transparent; color: var(--teal); font-size: 12px; padding: 5px; }
    .clear-button:disabled { color: #a4adb2; cursor: default; }
    .dataset-target { display: grid; gap: 7px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .dataset-target label { font-size: 11px; font-weight: 650; }
    .dataset-target input { min-width: 0; height: 36px; font-size: 11px; }
    .dataset-target-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .dataset-target-status { min-width: 0; color: var(--green); font-size: 10px; text-align: right; overflow-wrap: anywhere; }
    .dataset-target-status.error { color: var(--red); }
    .dataset-select-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 36px; gap: 6px; }
    .dataset-browse { height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--teal); font-size: 11px; font-weight: 700; white-space: nowrap; }
    .dataset-add-toggle { width: 36px; height: 36px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--teal); font-size: 22px; line-height: 1; }
    .dataset-add-toggle.tooltip-trigger::after { display: none; }
    .dataset-add-toggle:hover { border-color: var(--teal); background: var(--surface-muted); }
    .dataset-create-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; }
    .dataset-create-row input { min-width: 0; height: 34px; font-size: 11px; }
    .dataset-create-confirm, .dataset-create-cancel { height: 34px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .dataset-create-confirm { border: 0; padding: 0 10px; background: var(--green); color: #fff; }
    .dataset-create-cancel { width: 34px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--muted); font-size: 17px; }
    .dataset-create-confirm:disabled { cursor: wait; opacity: 0.55; }
    .session-list { min-height: 180px; overflow-y: auto; padding: 10px; }
    .session-empty { padding: 32px 12px; color: var(--muted); font-size: 13px; text-align: center; }
    .audio-item { padding: 12px 6px; border-bottom: 1px solid var(--line); }
    .audio-item:last-child { border-bottom: 0; }
    .audio-item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .audio-item-text { min-width: 0; margin: 0; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
    .remove-button { flex: 0 0 28px; width: 28px; height: 28px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; }
    .remove-button:hover { background: var(--surface-muted); color: var(--red); }
    .audio-item-meta { margin: 5px 0 9px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .audio-item audio { display: block; width: 100%; height: 36px; }
    .audio-item-actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 7px; }
    .mark-audio { border: 0; background: transparent; color: #a66c08; padding: 0; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .mark-audio:hover, .mark-audio.active { color: #d18b0d; }
    .mark-audio.active { text-decoration: underline; text-underline-offset: 3px; }
    .mark-audio:disabled { cursor: wait; opacity: 0.55; }
    .move-training { border: 0; background: transparent; color: var(--green); padding: 0; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .move-training:disabled { cursor: wait; opacity: 0.55; }

    .hidden { display: none !important; }

    @media (max-width: 1180px) {
      .app-layout { grid-template-columns: minmax(0, 1fr); }
      .session-panel { position: static; max-height: 520px; }
    }

    @media (max-width: 820px) {
      .topbar { padding: 0 16px; }
      .status span:last-child { display: none; }
      main { padding: 14px; }
      .app-layout, .content-stack, form, .workspace { max-width: calc(100vw - 28px); }
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .settings { border-left: 0; border-top: 1px solid var(--line); }
      .composer, .settings { max-width: 100%; overflow: hidden; padding: 18px; }
      .parameter-grid { grid-template-columns: 1fr; }
      .actionbar { align-items: stretch; flex-direction: column; }
      .action-buttons, .primary { width: 100%; }
      .action-buttons .stop-button { flex: 0 0 88px; }
      .action-buttons .primary { flex: 1 1 auto; }
      .audio-comparison { grid-template-columns: minmax(0, 1fr); }
      .postprocess-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .postprocess-head { align-items: stretch; flex-direction: column; }
      .postprocess-preset { width: 100%; }
      .field-row.text-heading { align-items: flex-start; flex-direction: column; }
      .split-settings { grid-template-columns: minmax(0, 1fr); }
    }

    @media (max-width: 440px) {
      main { padding: 10px; }
      .brand strong, .status { display: none; }
      .nav a { padding: 7px 9px; }
      .app-layout, .content-stack, form, .workspace { max-width: calc(100vw - 20px); }
      .composer, .settings { padding: 14px; }
      .mode-tabs label { font-size: 12px; }
      .device-group label { font-size: 13px; }
      .postprocess-grid { grid-template-columns: minmax(0, 1fr); }
      .postprocess-actions { align-items: stretch; flex-direction: column; }
      .postprocess-button { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/assets/voxcpm_logo.png" alt="VoxCPM">
      <strong>VoxCPM 本地推理</strong>
    </div>
    <div class="top-actions">
      <nav class="nav" aria-label="页面切换">
        <a class="active" href="/">推理</a>
        <a href="/lora">LoRA 训练</a>
        <a href="/datasets">训练集</a>
        <a href="/distill">蒸馏</a>
      </nav>
      <div class="status" id="deviceStatus">
        <span class="status-dot"></span>
        <span>正在检查设备</span>
      </div>
    </div>
  </header>

  <main>
    <div class="app-layout">
      <div class="content-stack">
      <form id="inferenceForm">
      <div class="workspace">
        <section class="composer">
          <div class="mode-tabs" role="radiogroup" aria-label="推理模式">
            <input id="modeDesign" type="radio" name="mode" value="design" checked>
            <label class="tooltip-trigger" id="modeDesignLabel" for="modeDesign" tabindex="0" data-tooltip="直接根据合成文本生成语音。VoxCPM2 可配合声音控制描述音色、情绪和语速；0.5B 使用基础文本转语音。">声音设计</label>
            <input id="modeReference" type="radio" name="mode" value="reference">
            <label class="tooltip-trigger" for="modeReference" tabindex="0" data-tooltip="仅使用参考音频提取音色，不需要填写参考文本。此模式只支持 VoxCPM2。">参考音色</label>
            <input id="modeUltimate" type="radio" name="mode" value="ultimate">
            <label class="tooltip-trigger" for="modeUltimate" tabindex="0" data-tooltip="同时使用参考音频及其准确文本进行续写式克隆，音色还原更强，但参考文本必须与音频内容一致。">高保真克隆</label>
          </div>

          <div class="field">
            <div class="field-row text-heading">
              <label class="tooltip-trigger" for="text" tabindex="0" data-tooltip="最终需要朗读的内容。普通模式合成一个音频；批量模式让每个非空行分别生成一个音频。每个任务内部如何拆成推理片段由下方切分方式决定。">合成文本</label>
              <div class="text-mode-tabs" role="radiogroup" aria-label="文本处理模式">
                <input id="batchOrdinary" type="radio" name="batch_mode" value="ordinary" checked>
                <label class="tooltip-trigger" for="batchOrdinary" tabindex="0" data-tooltip="全部输入作为一个普通任务，内部片段完成后合成为一个 WAV。普通任务最多允许 100 个推理片段。">普通</label>
                <input id="batchMultiple" type="radio" name="batch_mode" value="batch">
                <label class="tooltip-trigger" for="batchMultiple" tabindex="0" data-tooltip="按换行符拆成多个普通任务，每个非空行各自合成为一个 WAV；任务数量不设上限，可随时中止。">批量</label>
              </div>
            </div>
            <textarea id="text" name="text" required>你好，欢迎使用 VoxCPM 本地语音推理。</textarea>
            <div class="segment-count" id="segmentCount"></div>
            <div class="split-settings">
              <div class="split-mode-group">
                <label class="tooltip-trigger" tabindex="0" data-tooltip="只改变每条输出音频内部的推理片段，不改变普通/批量模式决定的最终 WAV 数量。">推理切分</label>
                <div class="split-mode-tabs" role="radiogroup" aria-label="推理切分方式">
                  <input id="splitNone" type="radio" name="split_mode" value="none">
                  <label class="tooltip-trigger" for="splitNone" tabindex="0" data-tooltip="整条任务只调用一次推理。超长文本可能增加显存、内存和失败风险。">不切</label>
                  <input id="splitSentences" type="radio" name="split_mode" value="sentences" checked>
                  <label class="tooltip-trigger" for="splitSentences" tabindex="0" data-tooltip="先识别句末标点，再按指定句子数量组合为一个推理片段。">按句数</label>
                  <input id="splitCharacters" type="radio" name="split_mode" value="characters">
                  <label class="tooltip-trigger" for="splitCharacters" tabindex="0" data-tooltip="累计完整句子；达到目标字数后在当前句末切分，不会从句子中间截断。">按字数</label>
                </div>
              </div>
              <div class="split-value-control" id="splitValueField">
                <label class="tooltip-trigger" id="splitValueLabel" for="splitValue" tabindex="0" data-tooltip="每个推理片段包含的句子数量，范围 1 到 100。">每段句数</label>
                <input id="splitValue" name="split_value" type="number" min="1" max="100" step="1" value="1">
              </div>
            </div>
          </div>

          <div class="batch-export-panel hidden" id="batchExportPanel">
            <div class="field">
              <label class="tooltip-trigger" for="batchOutputDir" tabindex="0" data-tooltip="每完成一条批量任务，立即将 WAV 同步复制到所选本地目录。WebUI 会话缓存仍保留，便于试听、下载和后处理。">批量保存路径</label>
              <div class="batch-output-row"><input id="batchOutputDir" name="batch_output_dir" type="text" readonly placeholder="可选：选择批量音频保存文件夹"><button class="dataset-browse" id="batchOutputBrowse" type="button">选择文件夹</button><button class="icon-button tooltip-trigger" id="batchOutputClear" type="button" aria-label="清除批量保存路径" data-tooltip="清除批量保存路径并关闭训练对同步。"><span aria-hidden="true">×</span></button></div>
              <div class="batch-export-status" id="batchExportStatus" aria-live="polite"></div>
            </div>
            <div class="toggle-row"><span class="tooltip-trigger" tabindex="0" data-tooltip="在批量保存目录中为每条 WAV 同时生成同名 LAB，内容取自该行的完整合成文本，可直接作为训练对。">同步生成 WAV/LAB 训练对</span><label class="switch"><input id="createTrainingPairs" name="create_training_pairs" type="checkbox" disabled><span></span></label></div>
            <div class="toggle-row"><span class="tooltip-trigger" tabindex="0" data-tooltip="以基础 Seed 为起点，按全局推理片段依次加一。可分散同一采样轨迹造成的低概率坏例，同时保持结果可复现。">自动轮换随机种子</span><label class="switch"><input id="rotateSeed" name="rotate_seed" type="checkbox" checked disabled><span></span></label></div>
          </div>

          <div class="field">
            <label class="tooltip-trigger" for="control" tabindex="0" data-tooltip="用自然语言描述音色、年龄、情绪、语速或语气。仅 VoxCPM2 声音设计模式支持，此描述不会作为朗读文本拼接。">声音控制</label>
            <input id="control" name="control" type="text" placeholder="年轻女声，语气温和，语速稍慢">
          </div>

          <div class="field hidden" id="referenceField">
            <label class="tooltip-trigger" for="referenceAudio" tabindex="0" data-tooltip="提供需要模仿的音色和说话特征。参考音色模式只提取音色；高保真克隆还会结合下方的参考音频文本。">参考音频</label>
            <label class="dropzone" id="dropzone" for="referenceAudio">
              <input id="referenceAudio" name="reference_audio" type="file" accept="audio/*">
              <span class="file-button">选择文件</span>
              <span class="file-name" id="fileName">WAV、FLAC、MP3、M4A、OGG</span>
            </label>
            <audio class="reference-preview hidden" id="referencePreview" controls preload="metadata"></audio>
          </div>

          <div class="field hidden" id="promptTextField">
            <label class="tooltip-trigger" for="promptText" tabindex="0" data-tooltip="填写参考音频中实际说出的完整文字，必须尽量逐字一致，用于高保真克隆的语音与文本对齐。">参考音频文本</label>
            <textarea id="promptText" name="prompt_text" placeholder="输入与参考音频完全一致的文字"></textarea>
          </div>
        </section>

        <aside class="settings">
          <div class="section">
            <h2 class="section-title">模型</h2>
            <div class="field">
              <label class="tooltip-trigger" for="modelKey" tabindex="0" data-tooltip="2B 模型能力最完整且输出 48kHz；1.5 是 0.6B 参数的稳定版，输出 44.1kHz；0.5B 最轻量，输出 16kHz。切换模型会释放当前权重并加载所选模型。">模型版本</label>
              <select id="modelKey" name="model_key">
                <option value="voxcpm2">VoxCPM2 · 2B · 48kHz</option>
                <option value="voxcpm1.5">VoxCPM1.5 · 0.6B · 44.1kHz</option>
                <option value="voxcpm-0.5b">VoxCPM · 0.5B · 16kHz</option>
              </select>
            </div>
            <div class="field">
              <label class="tooltip-trigger" for="loraSelect" tabindex="0" data-tooltip="加载与当前基础模型兼容的 LoRA 适配器，以应用微调后的音色或风格。不使用 LoRA 时保持基础模型输出。">LoRA</label>
              <div class="select-action-row">
                <select id="loraSelect" name="lora_id">
                  <option value="">不使用 LoRA</option>
                </select>
                <button class="icon-button" id="importLoraButton" type="button" title="导入 LoRA" aria-label="导入 LoRA"><span aria-hidden="true">⇧</span></button>
                <button class="icon-button" id="refreshLoraButton" type="button" title="刷新 LoRA 列表" aria-label="刷新 LoRA 列表"><span aria-hidden="true">↻</span></button>
                <input id="loraImportFile" type="file" accept=".zip,.safetensors" hidden>
              </div>
            </div>
            <div class="field">
              <div class="field-row"><label class="tooltip-trigger" for="loraStrength" tabindex="0" data-tooltip="缩放 LoRA 对基础模型的影响。0x 等同基础模型，1x 为训练时标准强度，提高后可能增强音色，也可能放大失真或损伤发音。">LoRA 强度</label><span class="value" id="loraStrengthOutput">1.00x</span></div>
              <input id="loraStrength" name="lora_strength" type="range" min="0" max="2" value="1" step="0.05" disabled>
            </div>
            <div class="device-group">
              <input id="deviceCuda" type="radio" name="device" value="cuda" checked>
              <label class="tooltip-trigger" for="deviceCuda" tabindex="0" data-tooltip="将完整模型放入显卡推理，通常速度最快。2B 模型完整 GPU 推理需要约 8 GB 显存；1.5 可在本机 4 GB 显存上实验加载，显存不足时服务会释放模型并报告错误。">GPU</label>
              <input id="deviceHybrid" type="radio" name="device" value="hybrid">
              <label class="tooltip-trigger" for="deviceHybrid" tabindex="0" data-tooltip="2B 专用：Base/Residual LM 和精度敏感的特征编码器保留在 CPU，DiT、VAE 解码器和去噪器使用 GPU；优先避免参考文案续写漂移。">稳定混合</label>
              <input id="deviceHybridMax" type="radio" name="device" value="hybrid-max">
              <label class="tooltip-trigger" for="deviceHybridMax" tabindex="0" data-tooltip="2B 专用：进一步把基础语言模型放入 GPU 以提高速度和显存利用率，但可能产生精度漂移，最长长度限制为 1024。">极限混合</label>
              <input id="deviceCpu" type="radio" name="device" value="cpu">
              <label class="tooltip-trigger" for="deviceCpu" tabindex="0" data-tooltip="全部使用系统内存和 CPU 推理，不占用显存，但生成速度明显更慢。">CPU</label>
            </div>
          </div>

          <div class="section">
            <h2 class="section-title">运行设置</h2>
            <div class="toggles">
              <div class="toggle-row"><span class="tooltip-trigger" tabindex="0" data-tooltip="先使用 ZipEnhancer 清理参考音频中的环境噪声，再提取音色特征；不会对最终生成音频做后处理。">加载并使用去噪器</span><label class="switch"><input id="denoise" name="denoise" type="checkbox" checked><span></span></label></div>
              <div class="toggle-row"><span class="tooltip-trigger" tabindex="0" data-tooltip="完整 GPU 模式编译模型，稳定混合模式仅编译 GPU DiT。LoRA 使用无 CUDA Graph 的兼容编译模式；首次运行预热较慢，切换模型或 LoRA 会自动释放旧编译模型。">模型优化</span><label class="switch"><input id="optimize" name="optimize" type="checkbox" checked><span></span></label></div>
              <div class="toggle-row"><span class="tooltip-trigger" tabindex="0" data-tooltip="在推理前规范数字、符号和部分中文表达，通常改善读法，但可能改变需要逐字保留的特殊文本。">文本标准化</span><label class="switch"><input id="normalize" name="normalize" type="checkbox"><span></span></label></div>
            </div>
          </div>

          <div class="section">
            <h2 class="section-title">推理参数</h2>
            <div class="field">
              <div class="field-row"><label class="tooltip-trigger" for="cfgValue" tabindex="0" data-tooltip="控制生成结果遵循文本和参考条件的强度。提高数值可能增强约束但也更容易失真；降低数值通常更自然但变化更大。">CFG</label><span class="value" id="cfgOutput">2.0</span></div>
              <input id="cfgValue" name="cfg_value" type="range" min="0.1" max="10" value="2" step="0.1">
            </div>
            <div class="field">
              <div class="field-row"><label class="tooltip-trigger" for="timesteps" tabindex="0" data-tooltip="扩散解码的迭代次数，耗时近似随步数线性增长。本机建议日常使用 10～12 步；20 步属于高质量慢速档，细节收益会逐渐减小。">扩散步数</label><span class="value" id="timestepsOutput">10</span></div>
              <input id="timesteps" name="inference_timesteps" type="range" min="1" max="100" value="10" step="1">
            </div>
            <div class="parameter-grid">
              <div class="field"><label class="tooltip-trigger" for="minLen" tabindex="0" data-tooltip="允许生成的最少音频 token 数。通常保持较小值，设置过大会强制补出额外内容。">最短长度</label><input id="minLen" name="min_len" type="number" min="1" max="4096" value="2"></div>
              <div class="field"><label class="tooltip-trigger" for="maxLen" tabindex="0" data-tooltip="单次生成允许的最大音频 token 数，用于限制输出时长和内存占用；过小可能截断语音。">最长长度</label><input id="maxLen" name="max_len" type="number" min="1" max="4096" value="4096"></div>
              <div class="field"><label class="tooltip-trigger" for="seed" tabindex="0" data-tooltip="控制随机采样。模型、LoRA、设备和其余参数相同时，相同种子有助于复现结果；坏例重试可能改用新的成功种子。">随机种子</label><input id="seed" name="seed" type="number" value="42"></div>
            </div>
          </div>
        </aside>
      </div>

      <div class="actionbar">
        <div class="action-feedback">
          <div class="message" id="message">就绪</div>
          <div class="inference-progress hidden" id="inferenceProgress" aria-live="polite"><progress id="inferenceProgressBar" max="1" value="0"></progress><span id="inferenceProgressText">等待开始</span></div>
        </div>
        <div class="action-buttons"><button class="stop-button" id="cancelInferenceButton" type="button" title="当前推理片段完成后停止后续任务" disabled>中止</button><button class="primary" id="generateButton" type="submit">开始生成</button></div>
      </div>
      </form>

      <section class="output" id="outputPanel">
        <div class="audio-comparison">
          <div class="audio-version">
            <div class="audio-version-head"><strong>原音频</strong><a class="download" id="downloadLink" download>下载 WAV</a></div>
            <audio id="audioPlayer" controls></audio>
          </div>
          <div class="audio-version hidden" id="processedVersion">
            <div class="audio-version-head"><strong>处理后音频</strong><span class="audio-version-state" id="processedState"></span><a class="download" id="processedDownload" download>下载 WAV</a></div>
            <audio id="processedPlayer" controls></audio>
          </div>
        </div>
        <div class="postprocess-panel">
          <div class="postprocess-head">
            <h2 class="postprocess-title">音频后处理</h2>
            <div class="field postprocess-preset">
              <label class="tooltip-trigger" for="postPreset" tabindex="0" data-tooltip="载入一组适合对白的 EQ、动态和响度参数。选择预设后仍可修改任意参数，修改后会自动标记为自定义。">预设</label>
              <select id="postPreset"><option value="clean">清晰对白</option><option value="soft">柔和人声</option><option value="broadcast">广播人声</option><option value="character">游戏角色</option><option value="custom">自定义</option></select>
            </div>
          </div>
          <div class="postprocess-grid">
            <div class="field"><div class="postprocess-field-head"><label class="tooltip-trigger" for="postHighpass" tabindex="0" data-tooltip="削除低于该频率的直流、震动和低频轰鸣。对白通常使用 60–90 Hz。">高通 Hz</label><label class="mini-switch" title="启用高通"><input id="postHighpassEnabled" type="checkbox" checked><span></span></label></div><input id="postHighpass" type="number" min="0" max="240" step="1" value="70"></div>
            <div class="field"><div class="postprocess-field-head"><label class="tooltip-trigger" for="postMud" tabindex="0" data-tooltip="固定在约 250 Hz 调整声音厚度。负值减少浑浊和扩音器感，过低会使声音单薄。">浑浊区 dB</label><label class="mini-switch" title="启用浑浊区 EQ"><input id="postMudEnabled" type="checkbox" checked><span></span></label></div><input id="postMud" type="number" min="-12" max="6" step="0.1" value="-1.5"></div>
            <div class="field"><div class="postprocess-field-head"><label class="tooltip-trigger" for="postPresence" tabindex="0" data-tooltip="固定在约 3 kHz 调整咬字与靠前感。正值更清晰，过高可能产生尖锐和齿音。">清晰度 dB</label><label class="mini-switch" title="启用清晰度 EQ"><input id="postPresenceEnabled" type="checkbox" checked><span></span></label></div><input id="postPresence" type="number" min="-12" max="12" step="0.1" value="1"></div>
            <div class="field"><div class="postprocess-field-head"><label class="tooltip-trigger" for="postAir" tabindex="0" data-tooltip="调整 8 kHz 以上的空气感与高频亮度。生成音频已有高频伪影时应保持较低。">空气感 dB</label><label class="mini-switch" title="启用空气感 EQ"><input id="postAirEnabled" type="checkbox" checked><span></span></label></div><input id="postAir" type="number" min="-12" max="12" step="0.1" value="0.5"></div>
            <div class="field"><div class="postprocess-field-head"><label class="tooltip-trigger" for="postThreshold" tabindex="0" data-tooltip="高于该电平的部分进入动态压缩。数值越低，压缩作用越频繁。">压缩阈值 dB</label><label class="mini-switch" title="启用压缩"><input id="postThresholdEnabled" type="checkbox" checked><span></span></label></div><input id="postThreshold" type="number" min="-48" max="0" step="0.5" value="-18"></div>
            <div class="field"><div class="postprocess-field-head"><label class="tooltip-trigger" for="postRatio" tabindex="0" data-tooltip="控制超过阈值后的压缩强度。对白通常使用 1.5:1–3:1。">压缩比</label><label class="mini-switch" title="启用压缩"><input id="postRatioEnabled" type="checkbox" checked><span></span></label></div><input id="postRatio" type="number" min="1" max="12" step="0.1" value="2"></div>
            <div class="field"><div class="postprocess-field-head"><label class="tooltip-trigger" for="postLufs" tabindex="0" data-tooltip="使用 EBU R128 将整体响度调整到目标值。独立对白通常为 -18 至 -14 LUFS。">目标 LUFS</label><label class="mini-switch" title="启用响度调整"><input id="postLufsEnabled" type="checkbox" checked><span></span></label></div><input id="postLufs" type="number" min="-30" max="-8" step="0.5" value="-16"></div>
            <div class="field"><div class="postprocess-field-head"><label class="tooltip-trigger" for="postLimiter" tabindex="0" data-tooltip="限制最终峰值，避免响度调整后削波。常用 -1 dB，数值不可高于 -0.1 dB。">峰值上限 dB</label><label class="mini-switch" title="启用限幅"><input id="postLimiterEnabled" type="checkbox" checked><span></span></label></div><input id="postLimiter" type="number" min="-8" max="-0.1" step="0.1" value="-1"></div>
            <div class="field"><div class="postprocess-field-head"><label class="tooltip-trigger" for="postPitch" tabindex="0" data-tooltip="在不改变时长的情况下移动音高。较大幅度可能产生金属感，常规修音建议保持 0。">移调 半音</label><label class="mini-switch" title="启用移调"><input id="postPitchEnabled" type="checkbox"><span></span></label></div><input id="postPitch" type="number" min="-12" max="12" step="0.1" value="0" disabled></div>
            <div class="field"><div class="postprocess-field-head"><label class="tooltip-trigger" for="postReverb" tabindex="0" data-tooltip="添加短房间混响的湿声比例。对白素材通常保持 0，仅在需要空间感时轻量使用。">混响比例</label><label class="mini-switch" title="启用混响"><input id="postReverbEnabled" type="checkbox"><span></span></label></div><input id="postReverb" type="number" min="0" max="0.5" step="0.01" value="0" disabled></div>
          </div>
          <div class="postprocess-actions"><span class="postprocess-message" id="postprocessMessage">处理结果会作为独立 WAV 缓存，原音频保持不变</span><button class="postprocess-button" id="postprocessButton" type="button" disabled>生成处理版本</button></div>
        </div>
      </section>
      </div>

      <aside class="session-panel" aria-label="当前会话音频">
        <div class="session-header">
          <h2 class="session-title">当前会话 <span class="session-count" id="sessionCount">0</span></h2>
          <button class="clear-button" id="clearSession" type="button">清空</button>
        </div>

    const propertyTooltip = document.createElement("div");

    let activeTooltipTarget = null;
    let tooltipTimer = null;

    function positionPropertyTooltip(target) {
      const margin = 12;
      const gap = 8;
      const targetRect = target.getBoundingClientRect();
      const tooltipRect = propertyTooltip.getBoundingClientRect();
      let left = targetRect.left + (targetRect.width - tooltipRect.width) / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - tooltipRect.width - margin));
      let top = targetRect.top - tooltipRect.height - gap;
      if (top < margin) top = targetRect.bottom + gap;
      if (top + tooltipRect.height > window.innerHeight - margin) {
        top = Math.max(margin, window.innerHeight - tooltipRect.height - margin);
      }
      propertyTooltip.style.left = `${Math.round(left)}px`;
      propertyTooltip.style.top = `${Math.round(top)}px`;
    }

    function showPropertyTooltip(target, immediate = false) {
      clearTimeout(tooltipTimer);
      const reveal = () => {
        if (!target.isConnected) return;
        activeTooltipTarget?.removeAttribute("aria-describedby");
        activeTooltipTarget = target;
        propertyTooltip.textContent = target.dataset.tooltip;
        propertyTooltip.setAttribute("aria-hidden", "false");
        target.setAttribute("aria-describedby", propertyTooltip.id);
        propertyTooltip.classList.add("visible");
        positionPropertyTooltip(target);
      };
      if (immediate) reveal();
      else tooltipTimer = setTimeout(reveal, 350);
    }

    function hidePropertyTooltip() {
      clearTimeout(tooltipTimer);
      activeTooltipTarget?.removeAttribute("aria-describedby");
      activeTooltipTarget = null;
      propertyTooltip.classList.remove("visible");
      propertyTooltip.setAttribute("aria-hidden", "true");
    }

    document.addEventListener("mouseover", (event) => {
      const target = event.target.closest?.(".tooltip-trigger");
      if (!target || target === activeTooltipTarget) return;
      showPropertyTooltip(target);
    });
    document.addEventListener("mouseout", (event) => {
      const target = event.target.closest?.(".tooltip-trigger");
      if (!target || target.contains(event.relatedTarget)) return;
      hidePropertyTooltip();
    });
    document.addEventListener("focusin", (event) => {
      const target = event.target.closest?.(".tooltip-trigger");
      if (target) showPropertyTooltip(target, true);
    });
    document.addEventListener("focusout", (event) => {
      const target = event.target.closest?.(".tooltip-trigger");
      if (target && !target.contains(event.relatedTarget)) hidePropertyTooltip();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") hidePropertyTooltip();
    });
    window.addEventListener("scroll", hidePropertyTooltip, true);
    window.addEventListener("resize", hidePropertyTooltip);

    function currentMode() {
      return modeInputs.find((input) => input.checked).value;
    }

    function currentBatchMode() {
      return batchInputs.find((input) => input.checked).value;
    }

    function currentSplitMode() {
      return splitModeInputs.find((input) => input.checked).value;
    }

    function splitSentenceText(value) {
      const normalized = value.replace(/\s+/g, " ").trim();
      if (!normalized) return [];
      const sentenceEndings = new Set([..."。！？!?；;…"]);
      const closingMarks = new Set([..."”’\"')）】》」』]}〉"]);
      const parts = [];
      let start = 0;
      let index = 0;
      while (index < normalized.length) {
        const character = normalized[index];
        let boundary = sentenceEndings.has(character);
        if (character === ".") {
          const previousIsDigit = index > 0 && /\d/.test(normalized[index - 1]);
          const nextIsDigit = index + 1 < normalized.length && /\d/.test(normalized[index + 1]);
          let lookahead = index + 1;
          while (lookahead < normalized.length && closingMarks.has(normalized[lookahead])) lookahead += 1;
          const nextCharacter = normalized[lookahead] || "";
          boundary = !(previousIsDigit && nextIsDigit)
            && (!nextCharacter || /\s/.test(nextCharacter) || nextCharacter.charCodeAt(0) > 127);
        }
        if (!boundary) {
          index += 1;
          continue;
        }
        let end = index + 1;
        while (end < normalized.length && sentenceEndings.has(normalized[end])) end += 1;
        while (end < normalized.length && closingMarks.has(normalized[end])) end += 1;
        const part = normalized.slice(start, end).trim();
        if (part) parts.push(part);
        start = end;
        index = end;
      }
      const remainder = normalized.slice(start).trim();
      if (remainder) parts.push(remainder);
      return parts;
    }

    function joinSentenceText(sentences) {
      let joined = "";
      for (const sentence of sentences) {
        if (joined && joined.charCodeAt(joined.length - 1) < 128 && sentence.charCodeAt(0) < 128) joined += " ";
        joined += sentence;
      }
      return joined;
    }

    function groupTextSegments(taskText, sentences, splitMode = currentSplitMode(), rawSplitValue = splitValue.value) {
      if (!sentences.length) return [];
      if (splitMode === "none") return [taskText];
      const size = Math.max(1, Number.parseInt(rawSplitValue, 10) || 1);
      if (splitMode === "sentences") {
        const groups = [];
        for (let index = 0; index < sentences.length; index += size) groups.push(joinSentenceText(sentences.slice(index, index + size)));
        return groups;
      }
      const groups = [];
      let current = [];
      let characterCount = 0;
      for (const sentence of sentences) {
        current.push(sentence);
        characterCount += Array.from(sentence).length;
        if (characterCount >= size) {
          groups.push(joinSentenceText(current));
          current = [];
          characterCount = 0;
        }
      }
      if (current.length) groups.push(joinSentenceText(current));
      return groups;
    }

    function planTextTasks(value, mode = currentBatchMode()) {
      const normalized = value.replace(/\r\n?/g, "\n");
      const sources = mode === "batch" ? normalized.split("\n") : [normalized];
      return sources
        .map((source) => {
          const taskText = source.replace(/\s+/g, " ").trim();
          return groupTextSegments(taskText, splitSentenceText(source));
        })
        .filter((segments) => segments.length);
    }

    const splitModeValues = { sentences: 1, characters: 100 };
    let previousSplitMode = currentSplitMode();

    function updateSplitControls() {
      const mode = currentSplitMode();
      if (previousSplitMode !== "none") splitModeValues[previousSplitMode] = Math.max(1, Number.parseInt(splitValue.value, 10) || 1);
      previousSplitMode = mode;
      const disabled = mode === "none";
      splitValueField.classList.toggle("hidden", disabled);
      splitValue.disabled = disabled;
      if (!disabled) {
        splitValue.value = splitModeValues[mode];
        if (mode === "sentences") {
          splitValue.min = "1";
          splitValue.max = "100";
          splitValueLabel.textContent = "每段句数";
          splitValueLabel.dataset.tooltip = "每个推理片段包含的句子数量，范围 1 到 100。";

        }
      }
      updateSegmentCount();
    }

    function updateSegmentCount() {
      const mode = currentBatchMode();
      const tasks = planTextTasks(textInput.value, mode);
      const taskCount = tasks.length;
      const sentenceCount = tasks.reduce((total, sentences) => total + sentences.length, 0);
      segmentCount.textContent = taskCount

        : "未检测到有效文本";
      button.textContent = mode === "batch" && taskCount > 1 ? `生成 ${taskCount} 条` : "开始生成";

      const hasDirectory = Boolean(batchOutputDir.value.trim());
      batchExportPanel.classList.toggle("hidden", !enabled);
      batchOutputDir.disabled = !enabled;
      batchOutputBrowse.disabled = !enabled;
      batchOutputClear.disabled = !enabled || !hasDirectory;

      rotateSeed.disabled = !enabled;

    async function loadBatchOutputDirectories() {
      try {
        const response = await fetch("/api/batch-output-directories", { cache: "no-store" });

        if (!response.ok) throw new Error(result.detail || "批量保存路径读取失败");
        if (!batchOutputDir.value) batchOutputDir.value = result.default || "";
        batchOutputDir.title = batchOutputDir.value;
        batchExportStatus.classList.remove("error");
        batchExportStatus.textContent = batchOutputDir.value ? "已选择保存路径" : "";
      } catch (error) {
        batchExportStatus.classList.add("error");
        batchExportStatus.textContent = error.message;
      } finally {
        updateBatchExportState();
      }
    }

    function loadSessionOutputs() {
      try {
        const stored = JSON.parse(sessionStorage.getItem(SESSION_STORAGE_KEY) || "[]");
        return Array.isArray(stored) ? stored.slice(0, SESSION_AUDIO_LIMIT) : [];
      } catch (error) {
        return [];
      }
    }

    function trimSessionOutputs() {
      if (sessionOutputs.length <= SESSION_AUDIO_LIMIT) return false;
      const original = sessionOutputs;
      const limited = original.slice(0, SESSION_AUDIO_LIMIT);
      const playingRow = [...sessionList.querySelectorAll(".audio-item")].find((row) => {
        const player = row.querySelector("audio");
        return player && !player.paused && !player.ended;
      });
      const playingItem = playingRow
        ? original.find((item) => item.id === playingRow.dataset.outputId)
        : null;
      if (playingItem && !limited.some((item) => item.id === playingItem.id)) limited.push(playingItem);
      sessionOutputs = limited;
      return sessionOutputs.length !== original.length;
    }

    function settleSessionOutputLimit() {
      if (!trimSessionOutputs()) return;
      saveSessionOutputs();
      renderSessionOutputs();
    }

    function saveSessionOutputs() {
      try {
        sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(sessionOutputs));
      } catch (error) {
        console.warn("Session audio cache exceeded browser storage capacity", error);
      }
    }

      const group = postprocessEnableGroups[key];
      if (!group) return;
      group.toggles.forEach((toggle) => { toggle.checked = enabled; });
      group.inputs.forEach((input) => { input.disabled = !enabled; });

    function applyPostprocessPreset(name) {
      const preset = postprocessPresets[name];
      if (!preset) return;
      Object.entries(preset).forEach(([key, value]) => {
        if (postprocessFields[key]) postprocessFields[key].value = value;
        else if (postprocessEnableGroups[key]) setPostprocessGroupEnabled(key, value);
