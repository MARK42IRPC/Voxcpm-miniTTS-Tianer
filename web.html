    async function moveSessionItemToTraining(item, moveButton) {
      if (!trainingDataset.value) {
        message.className = "message error";
        message.textContent = "请先选择目标训练集";
        return;
      }
      moveButton.disabled = true;
      moveButton.textContent = "移动中";
      const data = new FormData();
      data.set("filename", item.filename);
      data.set("dataset_dir", trainingDataset.value);
      try {
        const response = await fetch("/api/training-datasets/move", { method: "POST", body: data });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "移动失败");
        sessionOutputs = sessionOutputs.filter((entry) => entry.filename !== item.filename);
        saveSessionOutputs();
        renderSessionOutputs();
        if (currentOriginalOutput?.filename === item.filename) {
          currentOriginalOutput = null;
          audioPlayer.removeAttribute("src");
          postprocessButton.disabled = true;
        }
        if (currentProcessedOutput?.filename === item.filename) resetProcessedOutput();
        message.className = "message";
        message.textContent = `已移动到训练集 · ${result.filename} + ${result.lab_filename}`;
        await loadTrainingDatasets();
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message;
        moveButton.disabled = false;
        moveButton.textContent = "移动到训练集";
      }
    }

    function updateMarkButton(button, marked) {
      button.classList.toggle("active", Boolean(marked));
      button.textContent = marked ? "已标记" : "标记";
      button.title = marked ? "取消本条音频的元数据标记" : "在本条音频元数据中写入 marked 标记";
      button.setAttribute("aria-pressed", String(Boolean(marked)));
    }

    async function markSessionItem(item, markButton) {
      const nextMarked = !Boolean(item.marked);
      markButton.disabled = true;
      const data = new FormData();
      data.set("filename", item.filename);
      data.set("marked", String(nextMarked));
      if (item.exported_path) data.set("exported_path", item.exported_path);
      try {
        const response = await fetch("/api/audio/mark", { method: "POST", body: data });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "标记失败");
        item.marked = result.marked;
        item.marked_at = result.marked_at;
        saveSessionOutputs();
        updateMarkButton(markButton, item.marked);
        message.className = "message";
        message.textContent = item.marked ? `已标记 ${item.filename}` : `已取消标记 ${item.filename}`;
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message;
      } finally {
        markButton.disabled = false;
      }
    }

    function createSessionOutputRow(item) {
      const row = document.createElement("article");
      row.className = "audio-item";
      row.dataset.outputId = item.id;

      const head = document.createElement("div");
      head.className = "audio-item-head";
      const title = document.createElement("p");
      title.className = "audio-item-text";
      title.textContent = item.text || item.filename;
      const remove = document.createElement("button");
      remove.className = "remove-button";
      remove.type = "button";
      remove.title = "从会话列表移除";
      remove.setAttribute("aria-label", "从会话列表移除");
      remove.textContent = "×";
      remove.addEventListener("click", () => {
        sessionOutputs = sessionOutputs.filter((entry) => entry.id !== item.id);
        saveSessionOutputs();
        renderSessionOutputs();
      });
      head.append(title, remove);

      const meta = document.createElement("div");
      meta.className = "audio-item-meta";
      const loraLabel = item.lora_name ? ` · ${item.lora_name}` : "";
      const modelLabel = item.model || "VoxCPM";
      const deviceLabel = String(item.device || "").toUpperCase();
      meta.textContent = `${modelLabel}${loraLabel}${deviceLabel ? ` · ${deviceLabel}` : ""} · ${Number(item.duration).toFixed(2)} 秒`;

      const player = document.createElement("audio");
      player.controls = true;
      player.preload = "none";
      player.src = item.audio_url;
      player.addEventListener("play", () => pauseOtherPlayers(player));
      player.addEventListener("pause", () => setTimeout(settleSessionOutputLimit, 0));
      player.addEventListener("ended", () => setTimeout(settleSessionOutputLimit, 0));

      const actions = document.createElement("div");
      actions.className = "audio-item-actions";
      const markButton = document.createElement("button");
      markButton.className = "mark-audio";
      markButton.type = "button";
      updateMarkButton(markButton, item.marked);
      markButton.addEventListener("click", () => markSessionItem(item, markButton));
      const moveButton = document.createElement("button");
      moveButton.className = "move-training";
      moveButton.type = "button";
      moveButton.textContent = "移动到训练集";
      moveButton.addEventListener("click", () => moveSessionItemToTraining(item, moveButton));
      const download = document.createElement("a");
      download.className = "download";
      download.href = item.audio_url;
      download.download = item.filename;
      download.textContent = "下载 WAV";
      actions.append(markButton, moveButton, download);
      row.append(head, meta, player, actions);
      return row;
    }

    function renderSessionOutputs() {
      sessionCount.textContent = String(sessionOutputs.length);
      clearSession.disabled = sessionOutputs.length === 0;
      if (!sessionOutputs.length) {
        sessionList.replaceChildren();
        const empty = document.createElement("div");
        empty.className = "session-empty";
        empty.textContent = "本次会话还没有生成音频";
        sessionList.append(empty);
        return;
      }

      sessionList.querySelector(".session-empty")?.remove();
      const activeIds = new Set(sessionOutputs.map((item) => item.id));
      const existingRows = new Map();
      sessionList.querySelectorAll(".audio-item").forEach((row) => {
        if (!activeIds.has(row.dataset.outputId)) row.remove();
        else existingRows.set(row.dataset.outputId, row);
      });
      let cursor = sessionList.firstElementChild;
      for (const item of sessionOutputs) {
        const row = existingRows.get(item.id) || createSessionOutputRow(item);
        if (row !== cursor) sessionList.insertBefore(row, cursor);
        const markButton = row.querySelector(".mark-audio");
        if (markButton) updateMarkButton(markButton, item.marked);
        cursor = row.nextElementSibling;
      }
    }

    function addSessionOutputs(outputs, result) {
      const createdAt = Date.now();
      const existingByFilename = new Map(sessionOutputs.map((item) => [item.filename, item]));
      const newItems = [];
      outputs.forEach((output, index) => {
        const existing = existingByFilename.get(output.filename);
        const values = {
          ...output,
          model: result.model ?? existing?.model,
          lora_name: result.lora_name ?? existing?.lora_name,
          device: result.device ?? existing?.device,
        };
        if (existing) Object.assign(existing, values);
        else newItems.push({ ...values, id: `${createdAt}-${index}-${output.filename}`, created_at: createdAt });
      });
      newItems.reverse();
      sessionOutputs = [...newItems, ...sessionOutputs];
      trimSessionOutputs();
      saveSessionOutputs();
      renderSessionOutputs();
    }

    function ingestInferenceOutputs(outputs, result) {
      const jobId = result.job_id || observedInferenceJobId || "legacy";
      let candidates;
      if (jobId !== observedInferenceJobId) {
        observedInferenceJobId = jobId;
        observedInferenceOutputs = new Set(outputs.map((output) => output.filename));
        candidates = outputs.slice(-SESSION_AUDIO_LIMIT);
      } else {
        candidates = outputs.filter((output) => !observedInferenceOutputs.has(output.filename));
        candidates.forEach((output) => observedInferenceOutputs.add(output.filename));
      }
      if (candidates.length) addSessionOutputs(candidates, result);
    }

    function legacyInferenceParams(status) {
      const outputs = status.outputs || [];
      const firstOutput = outputs[0] || {};
      const exportedPath = outputs.find((output) => output.exported_path)?.exported_path || "";
      const matchingLora = loraCheckpoints.find((item) => item.display_name === status.lora_name);
      return {
        model_key: status.model,
        lora_id: matchingLora?.id,
        batch_mode: status.batch_mode,
        device: status.device,
        batch_output_dir: exportedPath.replace(/[\\/][^\\/]+$/, ""),
        create_training_pairs: outputs.some((output) => Boolean(output.lab_path)),
        rotate_seed: firstOutput.seed_strategy === "sequential",
        seed: firstOutput.effective_seeds?.[0] ?? firstOutput.successful_seed,
      };
    }

    function syncInferenceParams(status) {
      if (!status.running || !runtimeOptionsReady || syncedInferenceJobId === status.job_id) return;
      const completeSnapshot = Boolean(status.request_params);
      const params = status.request_params || legacyInferenceParams(status);
      const has = (key) => params[key] !== undefined && params[key] !== null;
      const checkValue = (inputs, value) => {
        const target = inputs.find((input) => input.value === value);
        if (target) target.checked = true;
      };
      if (has("model_key") && [...modelKey.options].some((option) => option.value === params.model_key)) {
        modelKey.value = params.model_key;
      }
      if (has("mode")) checkValue(modeInputs, params.mode);
      if (has("batch_mode")) checkValue(batchInputs, params.batch_mode);
      if (has("split_mode")) {
        checkValue(splitModeInputs, params.split_mode);
        previousSplitMode = params.split_mode;
        splitModeValues[params.split_mode] = Number(params.split_value) || 1;
      }
      if (has("device")) checkValue(deviceInputs, params.device);
      renderLoraOptions();
      if (has("lora_id") && [...loraSelect.options].some((option) => option.value === params.lora_id)) {
        loraSelect.value = params.lora_id;
      }
      updateDevice();
      if (has("lora_id") && [...loraSelect.options].some((option) => option.value === params.lora_id)) {
        loraSelect.value = params.lora_id;
      }
      if (has("text")) textInput.value = params.text;
      if (has("control")) control.value = params.control;
      if (has("prompt_text")) document.getElementById("promptText").value = params.prompt_text;
      if (has("split_value")) {
        splitModeValues[params.split_mode] = Number(params.split_value) || 1;
        splitValue.value = splitModeValues[params.split_mode];
      }
      if (has("batch_output_dir")) {
        batchOutputDir.value = params.batch_output_dir;
        batchOutputDir.title = params.batch_output_dir;
        batchExportStatus.textContent = params.batch_output_dir ? "已同步当前任务保存路径" : "";
      }
      if (has("create_training_pairs")) createTrainingPairs.checked = Boolean(params.create_training_pairs);
      if (has("rotate_seed")) rotateSeed.checked = Boolean(params.rotate_seed);
      if (has("lora_strength")) loraStrength.value = params.lora_strength;
      const valueFields = {
        cfg_value: "cfgValue",
        inference_timesteps: "timesteps",
        min_len: "minLen",
        max_len: "maxLen",
        seed: "seed",
      };
      Object.entries(valueFields).forEach(([key, id]) => {
        if (has(key)) document.getElementById(id).value = params[key];
      });
      ["normalize", "denoise", "optimize"].forEach((key) => {
        if (has(key)) document.getElementById(key).checked = Boolean(params[key]);
      });
      if (params.has_reference_audio && params.reference_filename) {
        fileName.textContent = `当前任务参考音频：${params.reference_filename}（重新提交前需重新选择）`;
      }
      updateMode();
      updateDevice();
      updateSplitControls();
      updateBatchExportState();
      document.getElementById("cfgOutput").textContent = Number(document.getElementById("cfgValue").value).toFixed(1);
      document.getElementById("timestepsOutput").textContent = document.getElementById("timesteps").value;
      document.getElementById("loraStrengthOutput").textContent = `${Number(loraStrength.value).toFixed(2)}x`;
      updateSegmentCount();
      syncedInferenceJobId = status.job_id;
      pendingInferenceSync = null;
      message.className = "message";
      message.textContent = completeSnapshot
        ? "已热接管当前推理任务 · 完整参数已同步"
        : "已热接管当前推理任务 · 已同步后端可用参数";
    }

    function queueInferenceSync(status) {
      if (!status.running || syncedInferenceJobId === status.job_id) return;
      pendingInferenceSync = status;
      syncInferenceParams(status);
    }

    function renderInferenceProgress(status, reveal = true) {
      if (reveal) inferenceProgress.classList.remove("hidden");
      const totalSegments = Number(status.total_segments || status.segment_count || 0);
      const completedSegments = Number(status.completed_segments ?? status.completed_segment_count ?? 0);
      const totalTasks = Number(status.total_tasks || status.task_count || 0);
      const completedTasks = Number(status.completed_tasks ?? status.completed_task_count ?? 0);
      inferenceProgressBar.max = Math.max(1, totalSegments);
      inferenceProgressBar.value = Math.min(completedSegments, Math.max(1, totalSegments));
      inferenceProgressText.textContent = `已导出 ${completedTasks}/${totalTasks} · 片段 ${completedSegments}/${totalSegments}`;
      cancelInferenceButton.disabled = !status.running || Boolean(status.cancel_requested);
      cancelInferenceButton.textContent = status.cancel_requested ? "中止中" : "中止";
      ingestInferenceOutputs(status.outputs || [], status);
    }

    async function pollInferenceProgress(revealIdle = false) {
      try {
        const response = await fetch("/api/inference/status", { cache: "no-store" });
        const status = await response.json();
        if (!response.ok) throw new Error(status.detail || "无法读取推理进度");
        queueInferenceSync(status);
        if (status.running || revealIdle) renderInferenceProgress(status, true);
        if (status.running) {
          button.disabled = true;
          button.textContent = Number(status.total_tasks) > 1 ? `生成中 · ${status.total_tasks} 条` : "生成中";
          cancelInferenceButton.disabled = Boolean(status.cancel_requested);
        } else if (!localInferenceRequest && inferencePollTimer !== null) {
          stopInferencePolling();
          cancelInferenceButton.disabled = true;
          button.disabled = false;
          updateSegmentCount();
        }
        return status;
      } catch (error) {
        return null;
      }
    }

    function startInferencePolling() {
      if (inferencePollTimer !== null) return;
      pollInferenceProgress(true);
      inferencePollTimer = setInterval(() => pollInferenceProgress(true), 500);
    }

    function stopInferencePolling() {
      if (inferencePollTimer === null) return;
      clearInterval(inferencePollTimer);
      inferencePollTimer = null;
    }

    function updateMode() {
      const supportsVoiceControl = modelKey.value === "voxcpm2";
      modeReference.disabled = !supportsVoiceControl;
      modeDesignLabel.textContent = supportsVoiceControl ? "声音设计" : "文本转语音";
      if (!supportsVoiceControl && modeReference.checked) modeDesign.checked = true;

      const mode = currentMode();
      control.disabled = !supportsVoiceControl || mode === "ultimate";
      referenceField.classList.toggle("hidden", mode === "design");
      promptTextField.classList.toggle("hidden", mode !== "ultimate");
      referenceAudio.required = mode !== "design";
      document.getElementById("promptText").required = mode === "ultimate";
    }

    function updateDevice() {
      const supportsHybrid = modelKey.value === "voxcpm2";
      renderLoraOptions();
      deviceHybrid.disabled = !supportsHybrid;
      deviceHybridMax.disabled = !supportsHybrid;
      if (!supportsHybrid && (deviceHybrid.checked || deviceHybridMax.checked)) deviceCuda.checked = true;
      if (deviceCuda.checked && !voxcpm2GpuSupported && supportsHybrid) {
        deviceHybrid.checked = true;
      }

      const useCuda = deviceCuda.checked;
      const useStableHybrid = deviceHybrid.checked;
      const useHybridMax = deviceHybridMax.checked;
      const useLora = Boolean(loraSelect.value);
      loraStrength.disabled = !useLora;
      const optimize = document.getElementById("optimize");
      const supportsOptimize = useCuda || useStableHybrid;
      const optimizeWasDisabled = optimize.disabled;
      optimize.disabled = !supportsOptimize;
      if (!supportsOptimize) optimize.checked = false;
      else if (optimizeWasDisabled) optimize.checked = true;
      maxLen.max = useHybridMax ? "1024" : "4096";
      if (useHybridMax && Number(maxLen.value) > 1024) maxLen.value = "1024";
      updateMode();
    }

    function renderLoraOptions() {
      const previousValue = loraSelect.value;
      const compatible = loraCheckpoints.filter((item) => item.model_key === modelKey.value);
      loraSelect.replaceChildren(new Option("不使用 LoRA", ""));
      compatible.forEach((item) => {
        loraSelect.add(new Option(`${item.display_name} · rank ${item.rank}`, item.id));
      });
      loraSelect.value = compatible.some((item) => item.id === previousValue) ? previousValue : "";
    }

    async function releaseOptimizedModel() {
      try {
        const response = await fetch("/api/model/release-optimized", { method: "POST" });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "旧编译模型释放失败");
        if (result.released) {
          message.className = "message";
          message.textContent = "已释放旧编译模型，下次推理将按当前选择重新优化";
        }
        return result.released;
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message;
        return false;
      }
    }

    async function refreshLoraCheckpoints(selectedId = "", announce = true) {
      refreshLoraButton.disabled = true;
      refreshLoraButton.classList.add("loading");
      try {
        const previousSelection = loraSelect.value;
        const response = await fetch("/api/lora/checkpoints", { cache: "no-store" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "LoRA 列表刷新失败");
        loraCheckpoints = data.checkpoints || [];
        renderLoraOptions();
        if (selectedId && loraCheckpoints.some((item) => item.id === selectedId && item.model_key === modelKey.value)) {
          loraSelect.value = selectedId;
        }
        if (loraSelect.value !== previousSelection) await releaseOptimizedModel();
        updateDevice();
        const compatibleCount = loraCheckpoints.filter((item) => item.model_key === modelKey.value).length;
        if (announce) {
          message.className = "message";
          message.textContent = `LoRA 列表已刷新 · 当前模型 ${compatibleCount} 个可用检查点`;
        }
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message;
      } finally {
        refreshLoraButton.disabled = false;
        refreshLoraButton.classList.remove("loading");
      }
    }

    async function importLoraCheckpoint(file) {
      const suffix = file.name.toLowerCase().split(".").pop();
      if (!['zip', 'safetensors'].includes(suffix)) {
        message.className = "message error";
        message.textContent = "仅支持 ZIP 或 safetensors LoRA 检查点";
        return;
      }
      importLoraButton.disabled = true;
      refreshLoraButton.disabled = true;
      const originalIcon = importLoraButton.querySelector("span").textContent;
      importLoraButton.querySelector("span").textContent = "…";
      message.className = "message";
      message.textContent = `正在为 ${modelKey.options[modelKey.selectedIndex].text} 导入 ${file.name}`;
      const data = new FormData();
      data.set("checkpoint_file", file);
      data.set("model_key", modelKey.value);
      try {
        const response = await fetch("/api/lora/checkpoints/import", { method: "POST", body: data });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "LoRA 导入失败");
        await refreshLoraCheckpoints(result.checkpoint.id, false);
        message.className = "message";
        message.textContent = result.reused
          ? `LoRA 已存在并选中 · ${result.checkpoint.display_name}`
          : `LoRA 已导入并选中 · ${result.checkpoint.display_name}`;
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message;
      } finally {
        importLoraButton.disabled = false;
        refreshLoraButton.disabled = false;
        importLoraButton.querySelector("span").textContent = originalIcon;
        loraImportFile.value = "";
      }
    }

    function bindRange(inputId, outputId, formatter = (value) => value) {
      const input = document.getElementById(inputId);
      const output = document.getElementById(outputId);
      input.addEventListener("input", () => { output.textContent = formatter(input.value); });
    }

    function formatElapsed(milliseconds) {
      const totalSeconds = milliseconds / 1000;
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = (totalSeconds % 60).toFixed(1).padStart(4, "0");
      return `${String(minutes).padStart(2, "0")}:${seconds}`;
    }

    function waitForAudioReady(audio, timeoutMs = 10000) {
      if (audio.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) return Promise.resolve();
      return new Promise((resolve) => {
        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          audio.removeEventListener("canplay", finish);
          audio.removeEventListener("error", finish);
          resolve();
        };
        audio.addEventListener("canplay", finish);
        audio.addEventListener("error", finish);
        setTimeout(finish, timeoutMs);
      });
    }

    async function loadStatus() {
      const statusElement = document.getElementById("deviceStatus");
      try {
        const response = await fetch("/api/status");
        const data = await response.json();
        voxcpm2GpuSupported = data.voxcpm2_gpu_supported;
        statusElement.querySelector(".status-dot").className = `status-dot ${data.cuda_available ? "ready" : "error"}`;
        statusElement.querySelector("span:last-child").textContent = data.cuda_available
          ? `${data.gpu_name} · ${data.gpu_memory_gb} GB · ${data.voxcpm2_gpu_supported ? "2B GPU 可用" : "2B 混合可用"}`
          : "CUDA 不可用";
        document.querySelector('option[value="voxcpm2"]').disabled = !data.models.voxcpm2;
        document.querySelector('option[value="voxcpm1.5"]').disabled = !data.models["voxcpm1.5"];
        document.querySelector('option[value="voxcpm-0.5b"]').disabled = !data.models["voxcpm-0.5b"];
        document.getElementById("denoise").disabled = !data.denoiser;
        loraCheckpoints = data.lora_checkpoints || [];
        updateDevice();
      } catch (error) {
        statusElement.querySelector(".status-dot").className = "status-dot error";
        statusElement.querySelector("span:last-child").textContent = "服务状态不可用";
      } finally {
        runtimeOptionsReady = true;
        if (pendingInferenceSync) syncInferenceParams(pendingInferenceSync);
      }
    }

    modeInputs.forEach((input) => input.addEventListener("change", updateMode));
    batchInputs.forEach((input) => input.addEventListener("change", () => {
      updateSegmentCount();
      updateBatchExportState();
    }));
    splitModeInputs.forEach((input) => input.addEventListener("change", updateSplitControls));
    splitValue.addEventListener("input", updateSegmentCount);
    textInput.addEventListener("input", updateSegmentCount);
    modelKey.addEventListener("change", () => {
      updateDevice();
      releaseOptimizedModel();
    });
    loraSelect.addEventListener("change", () => {
      updateDevice();
      releaseOptimizedModel();
    });
    importLoraButton.addEventListener("click", () => {
      loraImportFile.value = "";
      loraImportFile.click();
    });
    loraImportFile.addEventListener("change", () => {
      const file = loraImportFile.files[0];
      if (file) importLoraCheckpoint(file);
    });
    refreshLoraButton.addEventListener("click", () => refreshLoraCheckpoints());
    deviceInputs.forEach((input) => input.addEventListener("change", updateDevice));
    referenceAudio.addEventListener("change", () => {
      const file = referenceAudio.files[0];
      fileName.textContent = file?.name || "WAV、FLAC、MP3、M4A、OGG";
      if (referencePreviewUrl) URL.revokeObjectURL(referencePreviewUrl);
      referencePreviewUrl = file ? URL.createObjectURL(file) : null;
      referencePreview.classList.toggle("hidden", !referencePreviewUrl);
      referencePreview.src = referencePreviewUrl || "";
      if (referencePreviewUrl) referencePreview.load();
    });
    window.addEventListener("beforeunload", () => {
      if (referencePreviewUrl) URL.revokeObjectURL(referencePreviewUrl);
    });
    ["dragenter", "dragover"].forEach((eventName) => dropzone.addEventListener(eventName, () => dropzone.classList.add("active")));
    ["dragleave", "drop"].forEach((eventName) => dropzone.addEventListener(eventName, () => dropzone.classList.remove("active")));
    bindRange("cfgValue", "cfgOutput", (value) => Number(value).toFixed(1));
    bindRange("timesteps", "timestepsOutput");
    bindRange("loraStrength", "loraStrengthOutput", (value) => `${Number(value).toFixed(2)}x`);
    clearSession.addEventListener("click", () => {
      sessionOutputs = [];
      saveSessionOutputs();
      renderSessionOutputs();
    });
    datasetBrowse.addEventListener("click", browseTrainingDataset);
    batchOutputBrowse.addEventListener("click", browseBatchOutputDirectory);
    batchOutputClear.addEventListener("click", () => {
      batchOutputDir.value = "";
      batchOutputDir.title = "";
      batchExportStatus.textContent = "";
      batchExportStatus.classList.remove("error");
      createTrainingPairs.checked = false;
      updateBatchExportState();
    });
    datasetAddToggle.addEventListener("click", () => setDatasetCreatorVisible(datasetCreateRow.classList.contains("hidden")));
    datasetCreateCancel.addEventListener("click", () => setDatasetCreatorVisible(false));
    datasetCreateConfirm.addEventListener("click", createTrainingDataset);
    datasetName.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        createTrainingDataset();
      } else if (event.key === "Escape") {
        setDatasetCreatorVisible(false);
      }
    });
    audioPlayer.addEventListener("play", () => pauseOtherPlayers(audioPlayer));
    processedPlayer.addEventListener("play", () => pauseOtherPlayers(processedPlayer));
    postPreset.addEventListener("change", () => applyPostprocessPreset(postPreset.value));
    Object.values(postprocessFields).forEach((input) => input.addEventListener("input", () => { postPreset.value = "custom"; }));
    Object.entries(postprocessEnableGroups).forEach(([key, group]) => {
      group.toggles.forEach((toggle) => toggle.addEventListener("change", () => {
        setPostprocessGroupEnabled(key, toggle.checked);
        postPreset.value = "custom";
      }));
    });
    postprocessButton.addEventListener("click", async () => {
      if (!currentOriginalOutput) return;
      postprocessButton.disabled = true;
      postprocessButton.textContent = "处理中";
      postprocessMessage.textContent = "正在执行 EQ、动态和响度处理";
      const data = new FormData();
      data.set("filename", currentOriginalOutput.filename);
      data.set("preset", postPreset.value);
      Object.entries(postprocessFields).forEach(([key, input]) => data.set(key, input.value));
      Object.entries(postprocessEnableGroups).forEach(([key, group]) => data.set(key, String(group.toggles[0].checked)));
      try {
        const response = await fetch("/api/audio/postprocess", { method: "POST", body: data });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "后处理失败");
        currentProcessedOutput = {
          ...result,
          model: result.model || currentOriginalOutput.model,
          lora_name: result.lora_name || currentOriginalOutput.lora_name,
          device: result.device || currentOriginalOutput.device,
        };
        processedPlayer.src = `${result.audio_url}?t=${Date.now()}`;
        processedPlayer.load();
        processedDownload.href = result.audio_url;
        processedDownload.download = result.filename;
        processedState.textContent = `${result.postprocess_hash}${result.cached ? " · 缓存" : ""}`;
        processedVersion.classList.remove("hidden");
        addSessionOutputs([currentProcessedOutput], currentProcessedOutput);
        await waitForAudioReady(processedPlayer);
        postprocessMessage.textContent = result.cached ? "已载入相同参数的缓存版本" : `处理完成 · ${result.filename}`;
      } catch (error) {
        postprocessMessage.textContent = error.message;
      } finally {
        postprocessButton.disabled = !currentOriginalOutput;
        postprocessButton.textContent = "生成处理版本";
      }
    });

    cancelInferenceButton.addEventListener("click", async () => {
      cancelInferenceButton.disabled = true;
      cancelInferenceButton.textContent = "中止中";
      try {
        const response = await fetch("/api/inference/cancel", { method: "POST" });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "中止请求失败");
        if (result.accepted) {
          message.className = "message";
          message.textContent = "已请求中止，当前推理片段完成后停止";
          renderInferenceProgress(result, true);
        } else {
          message.textContent = "当前没有正在运行的推理任务";
        }
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message;
        cancelInferenceButton.disabled = false;
        cancelInferenceButton.textContent = "中止";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      localInferenceRequest = true;
      button.disabled = true;
      cancelInferenceButton.disabled = false;
      cancelInferenceButton.textContent = "中止";
      const requestedTasks = planTextTasks(textInput.value);
      const requestedTaskCount = requestedTasks.length;
      const requestedSegmentCount = requestedTasks.reduce((total, sentences) => total + sentences.length, 0);
      button.textContent = requestedTaskCount > 1 ? `生成中 · ${requestedTaskCount} 条` : "生成中";
      message.className = "message";
      inferenceProgress.classList.remove("hidden");
      inferenceProgressBar.max = Math.max(1, requestedSegmentCount);
      inferenceProgressBar.value = 0;
      inferenceProgressText.textContent = `已导出 0/${requestedTaskCount} · 片段 0/${requestedSegmentCount}`;
      const startedAt = performance.now();
      const updateTimer = () => {
        message.textContent = cancelInferenceButton.textContent === "中止中"
          ? `正在完成当前推理片段，随后中止 · ${formatElapsed(performance.now() - startedAt)}`
          : `正在生成 ${requestedTaskCount} 条音频 · ${requestedSegmentCount} 个推理片段 · ${formatElapsed(performance.now() - startedAt)}`;
      };
      updateTimer();
      const timerId = setInterval(updateTimer, 100);
      startInferencePolling();
      outputPanel.classList.remove("visible");

      const data = new FormData(form);
      data.set("split_mode", currentSplitMode());
      data.set("split_value", currentSplitMode() === "none" ? "1" : splitValue.value);
      ["denoise", "optimize", "normalize"].forEach((name) => {
        data.set(name, document.getElementById(name).checked ? "true" : "false");
      });

      try {
        const response = await fetch("/api/generate", { method: "POST", body: data });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "推理失败");
        const outputs = result.outputs || (result.filename ? [result] : []);
        const firstOutput = outputs[0];
        if (outputs.length) {
          ingestInferenceOutputs(outputs, result);
          currentOriginalOutput = {
            ...firstOutput,
            model: result.model,
            lora_name: result.lora_name,
            device: result.device,
          };
          resetProcessedOutput();
          audioPlayer.src = `${firstOutput.audio_url}?t=${Date.now()}`;
          audioPlayer.load();
          downloadLink.href = firstOutput.audio_url;
          downloadLink.download = firstOutput.filename;
          postprocessButton.disabled = false;
          await waitForAudioReady(audioPlayer);
          outputPanel.classList.add("visible");
        }
        renderInferenceProgress(result, true);
        const cacheLabel = result.input_cache_hit
          ? " · 输入缓存命中"
          : result.input_cache_created ? " · 输入已缓存" : "";
        const outputLabel = outputs.length > 1
          ? `${outputs.length} 条音频`
          : outputs.length === 1 ? `音频 ${Number(firstOutput.duration).toFixed(2)} 秒` : "未完成音频";
        const loraLabel = result.lora_name ? ` · ${result.lora_name}` : "";
        const exportLabel = result.batch_output_dir
          ? ` · 已保存到指定目录${result.training_pairs_created ? "并生成训练对" : ""}`
          : "";
        message.textContent = result.cancelled
          ? `已中止 · 保留并导出 ${outputs.length}/${result.task_count} 条 · 用时 ${formatElapsed(performance.now() - startedAt)}`
          : `${result.model}${loraLabel} · ${result.device.toUpperCase()} · ${outputLabel}${cacheLabel}${exportLabel} · 用时 ${formatElapsed(performance.now() - startedAt)}`;
      } catch (error) {
        message.className = "message error";
        message.textContent = `${error.message} · ${formatElapsed(performance.now() - startedAt)}`;
      } finally {
        clearInterval(timerId);
        await pollInferenceProgress(true);
        stopInferencePolling();
        cancelInferenceButton.disabled = true;
        cancelInferenceButton.textContent = "中止";
        button.disabled = false;
        localInferenceRequest = false;
        updateSegmentCount();
      }
    });

    applyPostprocessPreset(postPreset.value);
    updateMode();
    updateDevice();
    updateSplitControls();
    updateBatchExportState();
    renderSessionOutputs();
    loadStatus();
    pollInferenceProgress().then((status) => {
      if (status?.running) startInferencePolling();
    });
    loadTrainingDatasets();
    loadBatchOutputDirectories();
  </script>
</body>
</html>
