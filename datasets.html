<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoxCPM 训练集审核</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f4f6f7; --surface: #fff; --surface-muted: #eef1f2;
      --ink: #171a1c; --muted: #657078; --line: #d9dfe2;
      --green: #147a55; --green-hover: #0f6848; --teal: #147684;
      --red: #b43b3b; --red-hover: #963030; --amber: #9a6814; --shadow: 0 12px 30px rgba(25,35,40,.08);
    }
    * { box-sizing: border-box; }
    html { overflow-x: hidden; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--canvas); color: var(--ink); font-family: Inter,"Segoe UI","Microsoft YaHei",sans-serif; letter-spacing: 0; }
    button, select { min-width: 0; max-width: 100%; font: inherit; letter-spacing: 0; }
    button, label, select { cursor: pointer; }
    .topbar { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand img { width: 34px; height: 34px; object-fit: contain; }
    .brand strong { font-size: 17px; white-space: nowrap; }
    .nav { display: flex; align-items: center; gap: 4px; padding: 3px; background: var(--surface-muted); border-radius: 6px; }
    .nav a { padding: 7px 12px; border-radius: 4px; color: var(--muted); font-size: 13px; text-decoration: none; white-space: nowrap; }
    .nav a.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(20,28,32,.12); }
    main { width: 100%; min-width: 0; max-width: 1180px; margin: 0 auto; padding: 24px; }
    .workspace { width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
    .section { min-width: 0; padding: 22px 24px; }
    .section + .section { border-top: 1px solid var(--line); }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    h1, h2 { margin: 0; font-size: 14px; }
    .section-state, .queue-note { min-width: 0; max-width: 65%; overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .dataset-row { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 10px; }
    select { width: 100%; height: 40px; padding: 0 11px; border: 1px solid #c9d0d4; border-radius: 6px; background: var(--surface); color: var(--ink); outline: none; }
    select:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(20,118,132,.12); }
    button { height: 40px; padding: 0 14px; border-radius: 6px; font-weight: 700; }
    button:disabled { cursor: wait; opacity: .5; }
    .secondary { border: 1px solid var(--line); background: var(--surface); color: var(--teal); }
    .secondary:hover { border-color: var(--teal); }
    .status { min-height: 18px; margin-top: 8px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .status.error { color: var(--red); }
    .review-controls { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 18px; }
    .review-options { display: flex; align-items: center; gap: 18px; }
    .review-actions { display: flex; gap: 8px; }
    .toggle-row { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 12px; }
    .review-filter { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 12px; }
    .review-filter select { width: 112px; height: 34px; font-size: 12px; }
    .switch { position: relative; width: 42px; height: 24px; flex: 0 0 auto; }
    .switch input { position: absolute; opacity: 0; }
    .switch span { position: absolute; inset: 0; border-radius: 12px; background: #bdc5c9; transition: background 120ms; }
    .switch span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: transform 120ms; }
    .switch input:checked + span { background: var(--green); }
    .switch input:checked + span::after { transform: translateX(18px); }
    .stats { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); margin-top: 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .stat { padding: 14px 8px; text-align: center; }
    .stat + .stat { border-left: 1px solid var(--line); }
    .stat strong { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
    .stat span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .queue { display: grid; gap: 10px; }
    .review-item { display: grid; grid-template-columns: minmax(230px,320px) minmax(0,1fr) auto; align-items: center; gap: 16px; padding: 14px; border: 1px solid var(--line); border-radius: 7px; background: #fafbfb; }
    .audio-column { min-width: 0; }
    .filename-line { display: flex; min-width: 0; align-items: center; gap: 7px; margin-bottom: 8px; }
    .filename { min-width: 0; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .marked-badge { flex: 0 0 auto; padding: 2px 5px; border: 1px solid #e0a532; border-radius: 3px; background: #fff8df; color: #a86400; font-size: 9px; font-weight: 700; }
    audio { display: block; width: 100%; min-width: 0; max-width: 100%; height: 36px; }
    .spectrogram { display: block; width: 100%; height: 84px; margin-top: 8px; border: 1px solid #39484e; border-radius: 4px; background: #080d0f; }
    .spectrogram[data-state="queued"], .spectrogram[data-state="loading"] { background: linear-gradient(90deg,#080d0f 0%,#26363c 48%,#080d0f 100%); background-size: 200% 100%; animation: spectrum-loading 1.2s linear infinite; }
    @keyframes spectrum-loading { to { background-position: -200% 0; } }
    .transcript { min-width: 0; color: var(--ink); font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; }
    .transcript.missing { color: var(--red); }
    .item-actions { display: flex; gap: 8px; }
    .keep { min-width: 72px; border: 0; background: var(--green); color: #fff; }
    .keep:hover { background: var(--green-hover); }
    .redo { min-width: 72px; border: 1px solid #d7b878; background: #fffdf8; color: var(--amber); }
    .redo:hover { border-color: var(--amber); background: #fff8e8; }
    .delete { min-width: 72px; border: 0; background: var(--red); color: #fff; }
    .delete:hover { background: var(--red-hover); }
    .empty { padding: 48px 16px; color: var(--muted); font-size: 13px; text-align: center; border: 1px dashed var(--line); border-radius: 7px; }
    .tooltip-trigger { position: relative; display: inline-flex; width: max-content; max-width: 100%; align-items: center; gap: 5px; outline: 0; }
    .tooltip-trigger::after { content: "?"; display: inline-grid; place-items: center; flex: 0 0 16px; width: 16px; height: 16px; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); font-size: 10px; font-weight: 700; line-height: 1; }
    .tooltip-trigger:hover::after, .tooltip-trigger:focus-visible::after { border-color: var(--teal); color: var(--teal); }
    .property-tooltip { position: fixed; z-index: 1000; width: max-content; max-width: min(320px,calc(100vw - 24px)); padding: 8px 10px; border: 1px solid #3e484d; border-radius: 5px; background: #20272a; color: #fff; box-shadow: 0 8px 20px rgba(20,28,32,.18); font-size: 12px; line-height: 1.55; pointer-events: none; opacity: 0; transform: translateY(2px); transition: opacity 100ms,transform 100ms; }
    .property-tooltip.visible { opacity: 1; transform: translateY(0); }
    @media (max-width: 800px) {
      .topbar { align-items: stretch; flex-direction: column; gap: 8px; padding: 10px 14px; }
      .brand { display: none; }
      .nav { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); width: 100%; }
      .nav a { min-width: 0; padding: 7px 2px; overflow: hidden; font-size: 12px; text-align: center; text-overflow: ellipsis; }
      main { padding: 12px; }
      .section { padding: 18px 16px; }
      .review-item { width: 100%; min-width: 0; grid-template-columns: minmax(0,1fr); gap: 12px; }
      .item-actions { min-width: 0; }
      .item-actions button { flex: 1; }
    }
    @media (max-width: 560px) {
      .dataset-row { grid-template-columns: minmax(0,1fr) 1fr; }
      .dataset-row select { grid-column: 1 / -1; }
      .review-controls { align-items: stretch; flex-direction: column; }
      .review-options { justify-content: space-between; }
      .review-actions { display: grid; grid-template-columns: 1fr 1fr; }
      .review-actions button { width: 100%; padding: 0 8px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="/assets/voxcpm_logo.png" alt="VoxCPM"><strong>VoxCPM 本地推理</strong></div>
    <nav class="nav" aria-label="页面切换"><a href="/">推理</a><a href="/lora">LoRA 训练</a><a class="active" href="/datasets">训练集</a><a href="/distill">蒸馏</a></nav>
  </header>
  <main>
    <div class="workspace">
      <section class="section">
        <div class="section-head"><h1>训练集选择</h1><span class="section-state" id="directoryState">尚未加载</span></div>
        <div class="dataset-row">
          <select id="datasetSelect" aria-label="训练集"></select>
          <button class="secondary tooltip-trigger" id="browseButton" type="button" data-tooltip="打开系统文件夹选择器。可选择训练集根目录、train 目录或直接选择包含音频的 wavs 目录。">选择文件夹</button>
          <button class="secondary tooltip-trigger" id="refreshButton" type="button" data-tooltip="重新扫描磁盘中的音频和 LAB，并刷新审核队列与实时统计。">刷新列表</button>
        </div>
        <div class="status" id="status" aria-live="polite"></div>
        <div class="review-controls">
          <div class="review-options">
            <div class="toggle-row"><span class="tooltip-trigger" tabindex="0" data-tooltip="每次队列更新后自动播放当前最顶部的音频一次。浏览器阻止自动播放时，可先手动播放任意一条。">自动轮播</span><label class="switch"><input id="autoPlay" type="checkbox"><span></span></label></div>
            <label class="review-filter"><span class="tooltip-trigger" tabindex="0" data-tooltip="按 WAV 元数据中的 marked 标记筛选整个待审核训练集，不只筛选当前显示的 40 条。">标记筛选</span><select id="markFilter"><option value="all">全部</option><option value="marked">已标记</option><option value="unmarked">未标记</option></select></label>
          </div>
          <div class="review-actions">
            <button class="secondary tooltip-trigger" id="deduplicateButton" type="button" data-tooltip="按 LAB 去除 UTF-8 BOM 和首尾空白后的全文精确去重。每组保留文件名排序最前的一条，并删除其余真实音频及不再使用的 LAB。">快速去重</button>
            <button class="secondary tooltip-trigger" id="resetButton" type="button" data-tooltip="清除当前训练集的已保留记录，让所有仍在磁盘上的音频重新进入待审核队列；不会删除任何文件。">重新审核全部</button>
          </div>
        </div>
        <div class="stats" aria-label="审核统计">
          <div class="stat"><strong id="confirmedCount">0</strong><span>已确认保留</span></div>
          <div class="stat"><strong id="pendingCount">0</strong><span>未确认</span></div>
          <div class="stat"><strong id="totalCount">0</strong><span>当前音频总数</span></div>
        </div>
      </section>
      <section class="section">
        <div class="section-head"><h2>待审核音频</h2><span class="queue-note" id="queueNote"></span></div>
        <div class="queue" id="queue"><div class="empty">请选择训练集</div></div>
      </section>
    </div>
  </main>
  <div class="property-tooltip" id="propertyTooltip" role="tooltip"></div>
  <script>
    const datasetSelect = document.getElementById("datasetSelect");
    const browseButton = document.getElementById("browseButton");
    const refreshButton = document.getElementById("refreshButton");
    const deduplicateButton = document.getElementById("deduplicateButton");
    const resetButton = document.getElementById("resetButton");
    const autoPlay = document.getElementById("autoPlay");
    const markFilter = document.getElementById("markFilter");
    const status = document.getElementById("status");
    const directoryState = document.getElementById("directoryState");
    const queue = document.getElementById("queue");
    const queueNote = document.getElementById("queueNote");
    const confirmedCount = document.getElementById("confirmedCount");
    const pendingCount = document.getElementById("pendingCount");
    const totalCount = document.getElementById("totalCount");
    const controls = [datasetSelect, browseButton, refreshButton, deduplicateButton, resetButton, markFilter];
    const spectrumQueue = [];
    const spectrumConcurrency = 2;
    let spectrumActive = 0;
    let spectrumAudioContext = null;
    let currentSnapshot = null;

    function setBusy(busy) { controls.forEach((control) => { control.disabled = busy; }); }
    function setStatus(message, error = false) { status.textContent = message; status.classList.toggle("error", error); }
    function selectedDirectory() { return datasetSelect.value || ""; }
    function selectedMarkFilter() { return markFilter.value || "all"; }
    function formatSize(bytes) { return bytes >= 1048576 ? `${(bytes / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(bytes / 1024))} KB`; }

    function fftMagnitude(samples) {
      const size = samples.length;
      const real = Float64Array.from(samples);
      const imaginary = new Float64Array(size);
      for (let index = 1, reversed = 0; index < size; index += 1) {
        let bit = size >> 1;
        while (reversed & bit) { reversed ^= bit; bit >>= 1; }
        reversed ^= bit;
        if (index < reversed) {
          const swap = real[index]; real[index] = real[reversed]; real[reversed] = swap;
        }
      }
      for (let length = 2; length <= size; length <<= 1) {
        const angle = -2 * Math.PI / length;
        const stepReal = Math.cos(angle);
        const stepImaginary = Math.sin(angle);
        for (let start = 0; start < size; start += length) {
          let twiddleReal = 1;
          let twiddleImaginary = 0;
          for (let offset = 0; offset < length / 2; offset += 1) {
            const even = start + offset;
            const odd = even + length / 2;
            const oddReal = real[odd] * twiddleReal - imaginary[odd] * twiddleImaginary;
            const oddImaginary = real[odd] * twiddleImaginary + imaginary[odd] * twiddleReal;
            real[odd] = real[even] - oddReal;
            imaginary[odd] = imaginary[even] - oddImaginary;
            real[even] += oddReal;
            imaginary[even] += oddImaginary;
            const nextReal = twiddleReal * stepReal - twiddleImaginary * stepImaginary;
            twiddleImaginary = twiddleReal * stepImaginary + twiddleImaginary * stepReal;
            twiddleReal = nextReal;
          }
        }
      }
      const magnitude = new Float32Array(size / 2);
      for (let bin = 0; bin < magnitude.length; bin += 1) {
        magnitude[bin] = 2 * Math.hypot(real[bin], imaginary[bin]) / size;
      }
      return magnitude;
    }

    function drawSpectrogram(canvas, audioBuffer) {
      const cssWidth = Math.max(220, Math.round(canvas.clientWidth || 320));
      const cssHeight = 84;
      const pixelRatio = Math.min(devicePixelRatio || 1, 2);
      const width = Math.round(cssWidth * pixelRatio);
      const height = Math.round(cssHeight * pixelRatio);
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d", { alpha: false });
      const image = context.createImageData(width, height);
      const fftSize = 512;
      const frame = new Float32Array(fftSize);
      const channelCount = audioBuffer.numberOfChannels;
      const channels = Array.from({ length: channelCount }, (_, index) => audioBuffer.getChannelData(index));
      const maxBin = fftSize / 2 - 1;
      const floorDb = -88;
      const ceilingDb = -22;
      for (let x = 0; x < width; x += 1) {
        const center = Math.round((x + 0.5) * audioBuffer.length / width);
        const start = center - fftSize / 2;
        for (let sample = 0; sample < fftSize; sample += 1) {
          const sourceIndex = start + sample;
          let value = 0;
          if (sourceIndex >= 0 && sourceIndex < audioBuffer.length) {
            for (const channel of channels) value += channel[sourceIndex];
            value /= channelCount;
          }
          frame[sample] = value * (0.5 - 0.5 * Math.cos(2 * Math.PI * sample / (fftSize - 1)));
        }
        const magnitudes = fftMagnitude(frame);
        for (let y = 0; y < height; y += 1) {
          const highToLow = 1 - y / Math.max(1, height - 1);
          const bin = Math.max(1, Math.round(highToLow * maxBin));
          const decibels = 20 * Math.log10(Math.max(magnitudes[bin], 1e-8));
          const intensity = Math.pow(Math.max(0, Math.min(1, (decibels - floorDb) / (ceilingDb - floorDb))), 0.62);
          const red = 9 + intensity * (60 + 186 * highToLow);
          const green = 10 + intensity * 72;
          const blue = 9 + intensity * (246 - 196 * highToLow);
          const pixel = (y * width + x) * 4;
          image.data[pixel] = Math.round(red);
          image.data[pixel + 1] = Math.round(green);
          image.data[pixel + 2] = Math.round(blue);
          image.data[pixel + 3] = 255;
        }
      }
      context.putImageData(image, 0, 0);
      canvas.dataset.state = "ready";
    }

    function spectrumContext() {
      if (!spectrumAudioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        spectrumAudioContext = new AudioContextClass();
      }
      return spectrumAudioContext;
    }

    async function renderSpectrogram(canvas, audioUrl) {
      canvas.dataset.state = "loading";
      try {
        const response = await fetch(audioUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const audioBuffer = await spectrumContext().decodeAudioData(await response.arrayBuffer());
        if (canvas.isConnected) drawSpectrogram(canvas, audioBuffer);
      } catch (error) {
        canvas.dataset.state = "error";
        canvas.title = `频谱渲染失败：${error.message}`;
      }
    }

    function runSpectrumQueue() {
      while (spectrumActive < spectrumConcurrency && spectrumQueue.length) {
        const task = spectrumQueue.shift();
        if (!task.canvas.isConnected) continue;
        spectrumActive += 1;
        renderSpectrogram(task.canvas, task.audioUrl).finally(() => {
          spectrumActive -= 1;
          runSpectrumQueue();
        });
      }
    }

    function queueSpectrogram(canvas, audioUrl) {
      if (canvas.dataset.state !== "waiting") return;
      canvas.dataset.state = "queued";
      spectrumQueue.push({ canvas, audioUrl });
      runSpectrumQueue();
    }

    const spectrumObserver = "IntersectionObserver" in window
      ? new IntersectionObserver((entries, observer) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          observer.unobserve(entry.target);
          queueSpectrogram(entry.target, entry.target.dataset.audioUrl);
        }
      }, { rootMargin: "360px 0px" })
      : null;

    function observeSpectrogram(canvas, audioUrl) {
      canvas.dataset.audioUrl = audioUrl;
      if (spectrumObserver) spectrumObserver.observe(canvas);
      else queueSpectrogram(canvas, audioUrl);
    }

    async function readJson(response, fallback) {
      const result = await response.json();
      if (!response.ok) throw new Error(result.detail || fallback);
      return result;
    }

    async function loadDatasets(preferred = "") {
      const result = await readJson(await fetch("/api/training-datasets", { cache: "no-store" }), "训练集列表读取失败");
      const prior = preferred || localStorage.getItem("voxcpm-review-dataset") || result.default || "";
      datasetSelect.replaceChildren();
      for (const item of result.datasets) {
        const option = document.createElement("option");
        option.value = item.path;
        option.dataset.name = item.name;
        option.textContent = `${item.name} · ${item.file_count} WAV`;
        option.title = item.path;
        datasetSelect.append(option);
      }
      if ([...datasetSelect.options].some((option) => option.value === prior)) datasetSelect.value = prior;
      return selectedDirectory();
    }

    function playTopAudio() {
      if (!autoPlay.checked) return;
      const audio = queue.querySelector("audio");
      if (!audio) return;
      queue.querySelectorAll("audio").forEach((item) => { if (item !== audio) { item.pause(); item.currentTime = 0; } });
      audio.currentTime = 0;
      audio.play().catch(() => setStatus("浏览器暂未允许自动播放，请先手动播放任意一条音频"));
    }

    function makeActionButton(label, className, item, action) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = className;
      button.textContent = label;
      button.title = action === "delete"
        ? "删除真实音频及同名 LAB，不可撤销"
        : action === "redo" ? "保持兼容元数据参数不变，仅更换随机种子重新生成并替换本条音频" : "确认保留并移出待审核队列";
      button.addEventListener("click", () => action === "redo" ? redoAction(item.filename) : reviewAction(action, item.filename));
      return button;
    }

    function createReviewRow(item, directory) {
      const row = document.createElement("article");
      row.className = "review-item";
      row.dataset.filename = item.filename;
      const audioColumn = document.createElement("div");
      audioColumn.className = "audio-column";
      const name = document.createElement("strong");
      name.className = "filename";
      name.textContent = `${item.filename} · ${formatSize(item.size_bytes)}`;
      name.title = item.filename;
      const filenameLine = document.createElement("div");
      filenameLine.className = "filename-line";
      filenameLine.append(name);
      if (item.marked) {
        const badge = document.createElement("span");
        badge.className = "marked-badge";
        badge.textContent = "已标记";
        filenameLine.append(badge);
      }
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "none";
      const params = new URLSearchParams({ dataset_dir: directory, filename: item.filename });
      params.set("v", String(item.version || ""));
      audio.src = `/api/dataset-review/audio?${params}`;
      const spectrogram = document.createElement("canvas");
      spectrogram.className = "spectrogram";
      spectrogram.dataset.state = "waiting";
      spectrogram.setAttribute("role", "img");
      spectrogram.setAttribute("aria-label", `${item.filename} 的频谱图，高频在上、低频在下`);
      spectrogram.title = "高频在上（红），低频在下（蓝）";
      audioColumn.append(filenameLine, audio, spectrogram);
      observeSpectrogram(spectrogram, audio.src);
      const transcript = document.createElement("div");
      transcript.className = `transcript${item.has_lab ? "" : " missing"}`;
      transcript.textContent = item.has_lab ? (item.text || "[LAB 内容为空]") : "缺少同名 LAB 文本";
      const actions = document.createElement("div");
      actions.className = "item-actions";
      actions.append(makeActionButton("保留", "keep", item, "keep"));
      if (item.redo_supported) actions.append(makeActionButton("重做", "redo", item, "redo"));
      actions.append(makeActionButton("删除", "delete", item, "delete"));
      row.append(audioColumn, transcript, actions);
      return row;
    }

    function updateCounts(result) {
      confirmedCount.textContent = result.confirmed_count;
      pendingCount.textContent = result.pending_count;
      totalCount.textContent = result.total_count;
      const filteredCount = result.filtered_count ?? result.pending_count;
      const visibleCount = result.visible_count ?? Math.min(filteredCount, result.window_size);
      queueNote.textContent = selectedMarkFilter() === "all"
        ? (result.pending_count > visibleCount ? `显示队首 ${visibleCount} / ${result.pending_count} 条` : `${visibleCount} 条待审核`)
        : `当前筛选 ${visibleCount} / ${filteredCount} 条`;
      const selected = datasetSelect.selectedOptions[0];
      if (selected) selected.textContent = `${selected.dataset.name || selected.textContent.split(" · ")[0]} · ${result.total_count} 音频`;
    }

    function renderSnapshot(snapshot, shouldPlay = true) {
      currentSnapshot = snapshot;
      markFilter.value = snapshot.mark_filter || selectedMarkFilter();
      updateCounts(snapshot);
      directoryState.textContent = snapshot.directory;
      if (spectrumObserver) spectrumObserver.disconnect();
      spectrumQueue.length = 0;
      queue.replaceChildren();
      if (!snapshot.items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = snapshot.filtered_count === 0 && snapshot.pending_count
          ? "当前标记筛选下没有待审核音频"
          : snapshot.total_count ? "当前训练集已经全部确认" : "当前文件夹中没有支持的音频";
        queue.append(empty);
        return;
      }
      for (const item of snapshot.items) {
        queue.append(createReviewRow(item, snapshot.directory));
      }
      if (shouldPlay) setTimeout(playTopAudio, 0);
    }

    function applyReviewDelta(result) {
      const row = [...queue.querySelectorAll(".review-item")].find((item) => item.dataset.filename === result.removed_filename);
      if (row) {
        const audio = row.querySelector("audio");
        const spectrogram = row.querySelector(".spectrogram");
        if (audio) audio.pause();
        if (spectrogram && spectrumObserver) spectrumObserver.unobserve(spectrogram);
        row.remove();
      }
      if (result.replacement_item && ![...queue.querySelectorAll(".review-item")].some((item) => item.dataset.filename === result.replacement_item.filename)) {
        queue.append(createReviewRow(result.replacement_item, result.directory));
      }
      updateCounts(result);
      directoryState.textContent = result.directory;
      if (!queue.querySelector(".review-item")) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = result.filtered_count === 0 && result.pending_count
          ? "当前标记筛选下没有待审核音频"
          : result.total_count ? "当前训练集已经全部确认" : "当前文件夹中没有支持的音频";
        queue.append(empty);
      }
      setTimeout(playTopAudio, 0);
    }

    async function refreshReview(shouldPlay = true, forceScan = false) {
      const directory = selectedDirectory();
      if (!directory) return;
      setBusy(true);
      setStatus("正在扫描训练集");
      try {
        const params = new URLSearchParams({ dataset_dir: directory, refresh: String(forceScan), mark_filter: selectedMarkFilter() });
        const snapshot = await readJson(await fetch(`/api/dataset-review?${params}`, { cache: "no-store" }), "训练集扫描失败");
        localStorage.setItem("voxcpm-review-dataset", snapshot.directory);
        renderSnapshot(snapshot, shouldPlay);
        setStatus("列表与统计已更新");
      } catch (error) { setStatus(error.message, true); }
      finally { setBusy(false); }
    }

    async function reviewAction(action, filename) {
      setBusy(true);
      queue.querySelectorAll("button").forEach((button) => { button.disabled = true; });
      setStatus(action === "delete" ? `正在删除 ${filename}` : `正在保留 ${filename}`);
      const data = new FormData();
      data.set("dataset_dir", selectedDirectory());
      data.set("filename", filename);
      data.set("mark_filter", selectedMarkFilter());
      try {
        const result = await readJson(await fetch(`/api/dataset-review/${action}`, { method: "POST", body: data }), "审核操作失败");
        applyReviewDelta(result);
        setStatus(action === "delete" ? "音频及同名 LAB 已从磁盘删除" : "已确认保留");
      } catch (error) { setStatus(error.message, true); await refreshReview(false); }
      finally { setBusy(false); queue.querySelectorAll("button").forEach((button) => { button.disabled = false; }); }
    }

    async function redoAction(filename) {
      setBusy(true);
      queue.querySelectorAll("button").forEach((button) => { button.disabled = true; });
      setStatus(`正在按原配置重做 ${filename}`);
      const data = new FormData();
      data.set("dataset_dir", selectedDirectory());
      data.set("filename", filename);
      data.set("mark_filter", selectedMarkFilter());
      try {
        const result = await readJson(await fetch("/api/dataset-review/redo", { method: "POST", body: data }), "重做失败");
        const row = [...queue.querySelectorAll(".review-item")].find((item) => item.dataset.filename === filename);
        const replacement = createReviewRow(result.item, result.directory);
        if (row) row.replaceWith(replacement);
        updateCounts(result);
        setStatus(`重做完成 · Seed ${result.previous_seed} → ${result.new_seed}`);
        if (autoPlay.checked && queue.firstElementChild === replacement) setTimeout(playTopAudio, 0);
      } catch (error) { setStatus(error.message, true); }
      finally { setBusy(false); queue.querySelectorAll("button").forEach((button) => { button.disabled = false; }); }
    }

    async function browseDataset() {
      setBusy(true); setStatus("正在打开文件夹选择器");
      const data = new FormData(); data.set("initial_path", selectedDirectory());
      try {
        const result = await readJson(await fetch("/api/training-datasets/browse", { method: "POST", body: data }), "文件夹选择器启动失败");
        if (result.cancelled) { setStatus("已取消选择"); return; }
        await loadDatasets(result.path);
        await refreshReview(true, true);
      } catch (error) { setStatus(error.message, true); }
      finally { setBusy(false); }
    }

    async function resetReview() {
      if (!selectedDirectory() || !confirm("重新审核当前训练集的全部音频？此操作不会删除文件。")) return;
      setBusy(true); setStatus("正在清除审核记录");
      const data = new FormData(); data.set("dataset_dir", selectedDirectory()); data.set("mark_filter", selectedMarkFilter());
      try {
        const snapshot = await readJson(await fetch("/api/dataset-review/reset", { method: "POST", body: data }), "重新审核失败");
        renderSnapshot(snapshot, true); setStatus("全部音频已重新进入待审核队列");
      } catch (error) { setStatus(error.message, true); }
      finally { setBusy(false); }
    }

    async function deduplicateReview() {
      if (!selectedDirectory() || !confirm("按 LAB 全文精确去重？每组只保留文件名排序最前的一条，其余真实音频与不再使用的 LAB 将永久删除。")) return;
      setBusy(true); setStatus("正在扫描 LAB 并删除重复训练对");
      const data = new FormData(); data.set("dataset_dir", selectedDirectory()); data.set("mark_filter", selectedMarkFilter());
      try {
        const result = await readJson(await fetch("/api/dataset-review/deduplicate", { method: "POST", body: data }), "快速去重失败");
        renderSnapshot(result, true);
        setStatus(result.deleted_count ? `已删除 ${result.deleted_count} 个重复训练对，涉及 ${result.duplicate_groups} 组相同 LAB` : "没有发现 LAB 内容完全一致的训练对");
      } catch (error) { setStatus(error.message, true); await refreshReview(false, true); }
      finally { setBusy(false); }
    }

    const tooltip = document.getElementById("propertyTooltip");
    let tooltipTarget = null;
    function showTooltip(target) {
      const message = target.dataset.tooltip; if (!message) return;
      tooltipTarget = target; tooltip.textContent = message; tooltip.classList.add("visible");
      const rect = target.getBoundingClientRect(); const tip = tooltip.getBoundingClientRect();
      let left = Math.min(rect.left, innerWidth - tip.width - 12); left = Math.max(12, left);
      let top = rect.bottom + 8; if (top + tip.height > innerHeight - 12) top = rect.top - tip.height - 8;
      tooltip.style.left = `${left}px`; tooltip.style.top = `${Math.max(12, top)}px`;
    }
    function hideTooltip(target) { if (tooltipTarget !== target) return; tooltipTarget = null; tooltip.classList.remove("visible"); }
    document.querySelectorAll(".tooltip-trigger").forEach((target) => {
      target.addEventListener("mouseenter", () => showTooltip(target)); target.addEventListener("mouseleave", () => hideTooltip(target));
      target.addEventListener("focus", () => showTooltip(target)); target.addEventListener("blur", () => hideTooltip(target));
    });

    datasetSelect.addEventListener("change", () => refreshReview(true));
    markFilter.value = localStorage.getItem("voxcpm-review-mark-filter") || "all";
    markFilter.addEventListener("change", () => {
      localStorage.setItem("voxcpm-review-mark-filter", selectedMarkFilter());
      refreshReview(true);
    });
    browseButton.addEventListener("click", browseDataset);
    refreshButton.addEventListener("click", () => refreshReview(true, true));
    deduplicateButton.addEventListener("click", deduplicateReview);
    resetButton.addEventListener("click", resetReview);
    autoPlay.checked = localStorage.getItem("voxcpm-review-autoplay") === "true";
    autoPlay.addEventListener("change", () => { localStorage.setItem("voxcpm-review-autoplay", autoPlay.checked); if (autoPlay.checked) playTopAudio(); });
    loadDatasets().then((directory) => directory && refreshReview(false)).catch((error) => setStatus(error.message, true));
  </script>
</body>
</html>
